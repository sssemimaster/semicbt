<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 관리자 검수 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">🛠️ 문제 검수소 (Admin)</h1>
    <div class="text-xs text-slate-400">남은 대기 문제: <span id="draftCount" class="font-bold text-rose-400">0</span>개</div>
  </header>

  <main class="max-w-2xl w-full mx-auto p-4 py-8">
    
    <!-- 🔒 1차 방어막: 접속 비밀번호 입력부 -->
    <div id="loginSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 text-center mt-10">
      <h2 class="text-xl font-bold mb-4">관리자 권한 확인</h2>
      <input type="password" id="adminPin" placeholder="비밀번호 4자리 입력" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl mb-4 text-center text-xl tracking-[0.5em] outline-none focus:border-indigo-500">
      <button onclick="checkAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold transition shadow-md">입장하기</button>
    </div>

    <!-- 토큰 입력부 -->
    <div id="authSection" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
      <h2 class="font-bold mb-2">GitHub API 토큰 입력</h2>
      <input type="password" id="ghToken" placeholder="ghp_로 시작하는 토큰 입력..." class="w-full bg-slate-50 border p-3 rounded-lg mb-3">
      <button onclick="loadDrafts()" class="w-full bg-slate-800 text-white py-3 rounded-lg font-bold">대기소 시스템 가동</button>
    </div>

    <!-- 검수용 실제 화면 렌더러 -->
    <div id="reviewSection" class="hidden">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
        <div class="mb-4">
          <span id="catBadge" class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded">과목</span>
        </div>
        <h2 id="qTitle" class="text-lg font-bold text-slate-900 mb-6 leading-snug">문제 지문</h2>
        <div id="optContainer" class="space-y-3"></div>
        <div id="expBox" class="mt-6 p-4 bg-slate-50 border border-slate-200 rounded-xl hidden">
          <div id="resStatus" class="font-bold text-sm mb-2"></div>
          <p id="expText" class="text-sm text-slate-600 mb-3"></p>
          <div class="border-t pt-2"><span class="text-xs font-bold text-indigo-700">🗣️ 면접 스크립트:</span>
          <p id="ivText" class="text-sm font-medium mt-1"></p></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mt-6">
        <button onclick="rejectQuestion()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold py-4 rounded-xl border border-rose-200 transition">🗑️ 쓰레기통 (폐기)</button>
        <button onclick="approveQuestion()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md transition">✅ 사이트 정식 등재</button>
      </div>
    </div>
    
    <!-- ✨ 새로 추가된 기능: 제보받은 문제 강제 원복 시스템 -->
    <div id="manageSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mt-6 hidden">
      <h2 class="font-bold mb-2">🚨 라이브 문제 원복 (제보받은 문제 수정용)</h2>
      <p class="text-xs text-slate-500 mb-3">유저가 오류를 제보한 경우, 해당 문제 ID를 입력하면 라이브 서버에서 문제를 내리고 대기소(Draft)로 옮깁니다.</p>
      <div class="flex gap-2">
        <input type="text" id="liveQId" placeholder="문제 ID 입력 (예: AUTO-12345)" class="flex-1 bg-slate-50 border p-3 rounded-lg text-sm">
        <button onclick="moveLiveToDraft()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-3 rounded-lg font-bold text-sm whitespace-nowrap">대기소로 원복</button>
      </div>
    </div>

  </main>

  <script>
    // 🔴 중요: 본인의 저장소 정보 및 원하는 비밀번호로 변경하세요!
    const REPO_OWNER = "본인아이디"; 
    const REPO_NAME = "저장소이름";
    const ADMIN_PASSWORD = "2026"; // 1차 비밀번호

    let token = "";
    let drafts = [];
    let currentDraftIndex = 0;

    function checkAdmin() {
      const inputPin = document.getElementById('adminPin').value;
      if (inputPin === ADMIN_PASSWORD) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('authSection').classList.remove('hidden');
      } else {
        alert("비밀번호가 틀렸습니다.");
        document.getElementById('adminPin').value = "";
      }
    }

    async function loadDrafts() {
      token = document.getElementById('ghToken').value.trim();
      if(!token) return alert("토큰을 입력해주세요.");
      
      try {
        // 관리 기능 활성화
        document.getElementById('manageSection').classList.remove('hidden');
        
        const fileData = await fetchGitHubFile("data/draft_questions.json");
        drafts = JSON.parse(fileData.content);
        if(drafts.length === 0) return alert("현재 대기 중인 문제가 없습니다! (하단 원복 시스템은 사용 가능)");
        
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('reviewSection').classList.remove('hidden');
        renderAdminQuestion();
      } catch (e) {
        alert("데이터를 불러오지 못했습니다. 토큰이 정확한지 확인하세요.");
      }
    }

    function renderAdminQuestion() {
      if(drafts.length === 0) return;
      document.getElementById('draftCount').innerText = drafts.length - currentDraftIndex;
      const q = drafts[currentDraftIndex];
      document.getElementById('catBadge').innerText = `${q.category} > ${q.topic} (${q.difficulty})`;
      document.getElementById('qTitle').innerText = q.question;
      
      const optContainer = document.getElementById('optContainer');
      optContainer.innerHTML = '';
      document.getElementById('expBox').classList.add('hidden');
      
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-indigo-50 font-medium text-sm flex items-center transition";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs mr-3 text-slate-500 font-bold">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => showAnswer(idx, q);
        optContainer.appendChild(btn);
      });
    }

    function showAnswer(selectedIdx, q) {
      const box = document.getElementById('expBox');
      const status = document.getElementById('resStatus');
      box.classList.remove('hidden');
      if (selectedIdx === q.answer) {
        status.innerHTML = "⭕ 정답을 맞혔습니다!";
        status.className = "font-bold text-sm mb-2 text-emerald-600";
      } else {
        status.innerHTML = `❌ 틀렸습니다. (실제 정답: ${q.answer + 1}번)`;
        status.className = "font-bold text-sm mb-2 text-rose-600";
      }
      document.getElementById('expText').innerText = q.explanation;
      document.getElementById('ivText').innerText = q.interview_answer || "없음";
    }

    async function approveQuestion() {
      const q = drafts[currentDraftIndex];
      if(!confirm("이 문제를 사이트에 정식으로 반영하시겠습니까?")) return;
      
      try {
        const liveFile = await fetchGitHubFile("data/questions.json");
        let liveData = JSON.parse(liveFile.content);
        liveData.unshift(q);
        await updateGitHubFile("data/questions.json", liveFile.sha, JSON.stringify(liveData, null, 2), `Approve question ${q.id}`);
        await removeCurrentDraft();
        alert("✅ 성공적으로 등재되었습니다!");
        nextDraft();
      } catch(e) { alert("등재 중 오류가 발생했습니다."); console.error(e); }
    }

    async function rejectQuestion() {
      if(!confirm("이 문제를 폐기하시겠습니까? (복구 불가)")) return;
      try {
        await removeCurrentDraft();
        alert("🗑️ 문제가 폐기되었습니다.");
        nextDraft();
      } catch(e) { alert("폐기 중 오류가 발생했습니다."); }
    }

    async function removeCurrentDraft() {
      const draftFile = await fetchGitHubFile("data/draft_questions.json");
      let draftData = JSON.parse(draftFile.content);
      draftData.splice(currentDraftIndex, 1); 
      await updateGitHubFile("data/draft_questions.json", draftFile.sha, JSON.stringify(draftData, null, 2), "Remove processed draft");
    }

    function nextDraft() {
      if(currentDraftIndex < drafts.length - 1) {
        drafts.splice(currentDraftIndex, 1); 
        renderAdminQuestion();
      } else {
        document.getElementById('reviewSection').innerHTML = `<h2 class="text-xl font-bold text-slate-700 text-center mt-10">🎉 모든 검수가 끝났습니다!</h2><button onclick="location.reload()" class="w-full mt-6 bg-slate-800 text-white py-3 rounded-lg font-bold">새로고침</button>`;
      }
    }

    // ✨ 라이브 서버 문제 -> 검수 대기소(Draft) 원복 기능
    async function moveLiveToDraft() {
      const targetId = document.getElementById('liveQId').value.trim();
      if(!targetId) return alert("문제 ID를 입력하세요.");
      if(!confirm(`[${targetId}] 문제를 라이브에서 내리고 대기소로 원복하시겠습니까?`)) return;

      try {
        // 1. 라이브에서 문제 찾기 및 삭제
        const liveFile = await fetchGitHubFile("data/questions.json");
        let liveData = JSON.parse(liveFile.content);
        const targetQIndex = liveData.findIndex(q => q.id === targetId);
        
        if(targetQIndex === -1) return alert("라이브 서버에서 해당 ID의 문제를 찾을 수 없습니다.");
        
        const targetQ = liveData.splice(targetQIndex, 1)[0]; // 뽑아내기
        
        // 2. Draft에 넣기
        const draftFile = await fetchGitHubFile("data/draft_questions.json");
        let draftData = JSON.parse(draftFile.content);
        draftData.unshift(targetQ); // 맨 앞에 삽입
        
        // 3. 파일 두 개 모두 업데이트
        await updateGitHubFile("data/questions.json", liveFile.sha, JSON.stringify(liveData, null, 2), `Remove ${targetId} for review`);
        await updateGitHubFile("data/draft_questions.json", draftFile.sha, JSON.stringify(draftData, null, 2), `Move ${targetId} to draft`);
        
        alert("🚨 성공적으로 라이브에서 내리고 대기소로 원복했습니다.\n(새로고침 후 다시 불러오기를 누르면 검수 화면에 뜹니다.)");
        document.getElementById('liveQId').value = "";
      } catch (e) {
        alert("원복 중 오류가 발생했습니다.");
        console.error(e);
      }
    }

    // --- GitHub 통신 유틸리티 ---
    async function fetchGitHubFile(path) {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
        headers: { "Authorization": `token ${token}` }
      });
      const data = await res.json();
      if(data.message) throw new Error(data.message);
      const decoded = decodeURIComponent(escape(atob(data.content)));
      return { sha: data.sha, content: decoded };
    }

    async function updateGitHubFile(path, sha, newContentString, commitMsg) {
      const encoded = btoa(unescape(encodeURIComponent(newContentString)));
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
          message: commitMsg,
          content: encoded,
          sha: sha
        })
      });
      if(!res.ok) throw new Error("업데이트 실패");
    }
  </script>
</body>
</html>
