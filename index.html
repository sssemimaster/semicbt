<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 반도체 직무 전공 AI 플랫폼</title>
  
  <!-- 다크모드 깜빡임 방지 -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- ✨ 1. Tailwind CSS (Typography 플러그인 추가: 마크다운 예쁘게 렌더링) -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- ✨ 2. 마크다운 변환 라이브러리 (marked.js) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 antialiased min-h-screen flex flex-col relative transition-colors duration-200">

  <!-- 헤더 (기존과 동일) -->
  <header class="bg-indigo-900 dark:bg-indigo-950 text-white p-4 shadow-md flex justify-between items-center relative z-10">
    <h1 class="text-xl font-bold tracking-tight cursor-pointer" onclick="navTo('view-lobby')">⚡ SemiCBT</h1>
    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" id="themeToggleBtn" class="text-lg bg-indigo-800 dark:bg-indigo-900 hover:bg-indigo-700 dark:hover:bg-indigo-800 w-8 h-8 rounded-full flex items-center justify-center transition shadow-inner">🌙</button>
      <button class="bg-indigo-700 hover:bg-indigo-600 dark:bg-indigo-800 text-xs px-3 py-1.5 rounded-lg transition" onclick="navTo('view-lobby')">🏠 홈</button>
    </div>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center py-8">
    
    <!-- 🏠 메인 로비 (기존과 동일) -->
    <div id="view-lobby" class="w-full flex flex-col space-y-4">
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 text-center mb-4 transition-colors">
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">반도체 취업 마스터</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">원하는 학습 모드를 선택하세요.</p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="navTo('view-learning', {level: 'home'})" class="bg-emerald-50 dark:bg-emerald-900/20 hover:bg-emerald-100 border border-emerald-200 dark:border-emerald-800/50 text-emerald-800 dark:text-emerald-300 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">📖</span><span class="font-bold text-sm">이론 백과사전</span>
        </button>
        <button onclick="navTo('view-note')" class="bg-amber-50 dark:bg-amber-900/20 hover:bg-amber-100 border border-amber-200 dark:border-amber-800/50 text-amber-800 dark:text-amber-300 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">⭐</span><span class="font-bold text-sm">오답 노트</span>
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <button onclick="openSetup('quiz')" class="bg-indigo-50 dark:bg-indigo-900/20 hover:bg-indigo-100 border border-indigo-200 dark:border-indigo-800/50 text-indigo-800 dark:text-indigo-300 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">📝</span><span class="font-bold text-lg">객관식 전공 시험</span>
        </button>
        <button onclick="openSetup('interview')" class="bg-rose-50 dark:bg-rose-900/20 hover:bg-rose-100 border border-rose-200 dark:border-rose-800/50 text-rose-800 dark:text-rose-300 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">🗣️</span><span class="font-bold text-lg">실무 면접 대비</span>
        </button>
      </div>
    </div>

    <!-- ⚙️ 설정 화면, 📝 퀴즈 뷰, 🗣️ 면접 뷰, ⭐ 오답노트 뷰, 🏆 결과 뷰 (기존 로직 유지, HTML 생략 없이 포함) -->
    <!-- (이전 코드와 완벽히 동일하므로 기능 보존됨) -->
    <div id="view-setup" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 뒤로</button>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6">
        <h2 id="setupTitle" class="text-xl font-bold text-slate-800 dark:text-white mb-6">설정</h2>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">과목 선택</label>
          <select id="select-subject" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-lg p-3 outline-none"><option value="ALL">✨ 전체 과목 통합</option><option value="반도체 기초 이론">반도체 기초 이론</option><option value="반도체 8대 공정">반도체 8대 공정</option><option value="차세대 첨단 기술">차세대 첨단 기술</option></select>
        </div>
        <div class="mb-8">
          <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">문항 수 선택</label>
          <select id="select-count" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 rounded-lg p-3 outline-none"><option value="ALL">최대 (모두 풀기)</option><option value="5">5개</option><option value="10">10개</option></select>
        </div>
        <button onclick="startSession()" class="w-full bg-slate-800 dark:bg-indigo-600 text-white font-bold py-3.5 rounded-xl">시작하기</button>
      </div>
    </div>

    <!-- 객관식 풀이 영역 -->
    <div id="view-quiz" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit outline-none">⬅️ 종료</button>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6">
        <div class="flex justify-between items-center mb-4">
          <div><span id="qBadge" class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded mr-2">과목명</span><span id="qProgress" class="text-xs text-slate-400 font-medium">1/10</span></div>
          <button onclick="toggleStar()" id="starBtn" class="text-3xl text-slate-200 dark:text-slate-600 outline-none">☆</button>
        </div>
        <h2 id="qTitle" class="text-lg font-bold text-slate-900 dark:text-white mb-6">문제 지문</h2>
        <div id="qOptions" class="space-y-3"></div>
        <div id="qExpBox" class="mt-6 p-4 bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl hidden">
          <div id="qStatus" class="font-bold text-sm mb-2"></div>
          <p id="qExpText" class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed mb-4"></p>
          <div class="flex gap-2">
            <button onclick="openReportModal()" class="w-1/3 bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800 py-2.5 rounded-lg text-sm font-semibold">🚨 오류 제보</button>
            <button id="qNextBtn" onclick="nextQuiz()" class="w-2/3 bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold">다음 문제</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 면접 대비 영역 -->
    <div id="view-interview" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit outline-none">⬅️ 종료</button>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6">
        <div class="flex justify-between items-center mb-4"><div><span id="iBadge" class="bg-rose-100 dark:bg-rose-900/30 text-rose-700 dark:text-rose-300 text-xs font-semibold px-2.5 py-1 rounded mr-2">면접 시나리오</span><span id="iProgress" class="text-xs text-slate-400 font-medium">1/10</span></div></div>
        <h2 id="iTitle" class="text-lg font-bold text-slate-900 dark:text-white mb-6 leading-snug">질문 지문</h2>
        <button id="iRevealBtn" onclick="revealInterview()" class="w-full bg-slate-50 dark:bg-slate-700/50 text-slate-600 dark:text-slate-400 font-bold py-12 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600">🤔 소리내어 답변한 뒤 클릭</button>
        <div id="iExpBox" class="mt-6 p-4 bg-rose-50 dark:bg-rose-900/10 border border-rose-200 dark:border-rose-800/50 rounded-xl hidden">
          <span class="text-xs font-bold text-rose-700 dark:text-rose-400 block mb-1">💡 반드시 포함되어야 할 핵심 키워드</span>
          <div id="iKeywords" class="flex flex-wrap gap-2 mb-4"></div>
          <div class="border-t border-rose-200 dark:border-rose-800/50 pt-4 mt-2">
            <span class="text-xs font-bold text-slate-800 dark:text-slate-200 block mb-2">🗣️ 모범 두괄식 스크립트</span>
            <p id="iAnsText" class="text-sm text-slate-800 dark:text-slate-300 font-medium leading-relaxed mb-4"></p>
          </div>
          <div class="flex gap-2 border-t border-rose-200 dark:border-rose-800/50 pt-4 mt-2">
            <button onclick="openReportModal()" class="w-1/3 bg-white dark:bg-slate-700 text-rose-600 dark:text-rose-400 py-2.5 rounded-lg text-sm font-semibold border border-rose-200 dark:border-slate-600">🚨 오류 제보</button>
            <button id="iNextBtn" onclick="nextInterview()" class="w-2/3 bg-slate-800 text-white py-2.5 rounded-lg text-sm font-semibold">다음 문항</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 결과 뷰 -->
    <div id="view-result" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3">⬅️ 홈으로</button>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-8 text-center">
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">모의고사 완료!</h2>
        <div class="flex justify-center items-center my-6"><div class="w-32 h-32 rounded-full border-8 border-indigo-500 flex flex-col items-center justify-center"><span id="scoreText" class="text-3xl font-black text-indigo-600 dark:text-indigo-400">80</span><span class="text-sm text-slate-500 font-bold">% 정답률</span></div></div>
        <p id="scoreDetail" class="text-base text-slate-600 dark:text-slate-300 font-medium mb-6">결과</p>
        <button onclick="navTo('view-lobby')" class="w-full bg-slate-800 dark:bg-indigo-600 text-white font-bold py-3.5 rounded-xl">메인 로비로 돌아가기</button>
      </div>
    </div>

    <!-- 오답 노트 -->
    <div id="view-note" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3">⬅️ 뒤로</button>
      <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 mb-4 text-center">
        <h2 class="text-xl font-bold text-slate-800 dark:text-white">⭐ 나의 객관식 오답노트</h2>
      </div>
      <div id="noteContainer" class="space-y-4"></div>
    </div>

    <!-- 📖 ✨ 업그레이드된 이론 백과사전 뷰 ✨ -->
    <div id="view-learning" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 뒤로</button>
      <div class="mb-4 relative">
        <input type="text" id="theorySearchInput" onkeyup="handleTheorySearch()" placeholder="🔍 키워드, 기술명, 공정 검색..." class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-xl p-4 shadow-sm outline-none focus:border-emerald-500 dark:focus:border-emerald-400 transition font-medium">
      </div>
      <div id="breadcrumbContainer" class="bg-emerald-50 dark:bg-emerald-900/20 rounded-xl border border-emerald-200 dark:border-emerald-800/50 p-3 mb-4 flex flex-wrap items-center shadow-sm gap-y-2"></div>
      <div id="learningContainer" class="grid grid-cols-1 gap-4"></div>
    </div>

  </main>

  <!-- 오류 제보 팝업 -->
  <div id="reportModal" class="fixed inset-0 bg-slate-900/60 dark:bg-slate-900/80 hidden items-center justify-center z-50 px-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-xl relative transform transition-all">
      <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">🚨 문제/면접 오류 제보</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">제보 내용은 DB를 통해 관리자에게 즉시 전달됩니다.</p>
      <textarea id="reportContent" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl p-4 text-sm h-32 outline-none focus:border-rose-500 dark:text-white mb-4 resize-none" placeholder="오류 내용을 상세히 적어주세요."></textarea>
      <div class="flex gap-2">
        <button onclick="closeReportModal()" class="w-1/2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-3 rounded-xl">취소</button>
        <button id="submitReportBtn" onclick="submitReport()" class="w-1/2 bg-rose-600 text-white font-bold py-3 rounded-xl">제출하기</button>
      </div>
    </div>
  </div>

  <script>
    // 테마 토글
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeToggleBtn').innerText = isDark ? '☀️' : '🌙';
    }
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('themeToggleBtn').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    });

    // 🔴 Supabase 설정
    const SUPABASE_URL = "https://hyqsrajudsymexxuekfb.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cXNyYWp1ZHN5bWV4eHVla2ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzA0MDEsImV4cCI6MjEwOTcwNjQwMX0.6OPx9ClxjCnIfGcCFwYhgbWICcpgBI1cvx1QcAyVvIY"; 
    let supabaseClient; try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

    // 전역 변수
    let allQuizData = [];    
    let allInterviewData = []; 
    let allTheories = [];    
    let filteredSession = [];   
    let currentIndex = 0;    
    let correctCount = 0;
    let currentMode = 'quiz';
    let starredIds = JSON.parse(localStorage.getItem('semiCbtStarred')) || [];

    const FIXED_CATEGORIES = ["반도체 기초 이론", "반도체 8대 공정", "차세대 첨단 기술"];
    const FIXED_SUBJECTS = ["반도체 물리", "트랜지스터 소자", "메모리 반도체", "1. 웨이퍼 제조 공정", "2. 산화 공정 (Oxidation)", "3. 포토 공정 (Photo)", "4. 식각 공정 (Etching)", "5. 박막 증착 공정 (Deposition)", "6. 금속 배선 공정 (Metallization)", "7. EDS 공정 (Testing)", "8. 패키징 공정 (Packaging)", "차세대 소자 기술", "어드밴스드 패키징"];

    let currentViewId = 'view-lobby';
    let learnState = { level: 'home', category: '', subject: '', theoryId: '' };

    async function initApp() {
      try {
        const timestamp = new Date().getTime();
        const [qRes, iRes, tRes] = await Promise.all([
          fetch(`./data/questions.json?t=${timestamp}`).catch(() => null),
          fetch(`./data/interviews.json?t=${timestamp}`).catch(() => null),
          fetch(`./data/theories.json?t=${timestamp}`).catch(() => null)
        ]);
        if(qRes && qRes.ok) allQuizData = await qRes.json();
        if(iRes && iRes.ok) allInterviewData = await iRes.json();
        if(tRes && tRes.ok) {
          const rawTheories = await tRes.json();
          allTheories = rawTheories.map((t, idx) => ({ ...t, id: t.id || "T-" + idx, category: t.category || (t.path ? t.path[0] : "기타"), subject: t.subject || (t.path && t.path.length > 1 ? t.path[1] : "일반") }));
        }
        history.replaceState({ viewId: 'view-lobby', learnState: learnState }, "");
        applyState('view-lobby', learnState);
      } catch (e) { console.error(e); }
    }

    // 네비게이션
    function navTo(viewId, newLearnState = null) {
      if (newLearnState) learnState = { ...learnState, ...newLearnState };
      history.pushState({ viewId: viewId, learnState: JSON.parse(JSON.stringify(learnState)) }, "");
      applyState(viewId, learnState);
    }
    window.addEventListener('popstate', (e) => {
      if (e.state) { learnState = e.state.learnState; applyState(e.state.viewId, learnState); } 
      else { applyState('view-lobby', { level: 'home' }); }
    });
    function goBack() {
      if (currentViewId === 'view-learning' && document.getElementById('theorySearchInput').value.trim() !== '') {
        document.getElementById('theorySearchInput').value = ''; applyState('view-learning', learnState);
      } else { history.back(); }
    }
    function applyState(viewId, state) {
      ['view-lobby', 'view-setup', 'view-quiz', 'view-interview', 'view-learning', 'view-note', 'view-result'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
      currentViewId = viewId;
      if (viewId === 'view-learning') {
        document.getElementById('theorySearchInput').value = '';
        if (state.level === 'home') renderHomeDOM(); else if (state.level === 'category') renderSubjectsDOM(state.category); else if (state.level === 'subject') renderTitlesDOM(state.category, state.subject); else if (state.level === 'detail') renderDetailDOM(state.theoryId);
      } else if (viewId === 'view-note') renderNoteDOM();
    }

    // ==========================================
    // 📖 ✨ [업그레이드] 이론 백과사전 로직 ✨
    // ==========================================
    function renderHomeDOM() {
      renderBreadcrumb();
      const container = document.getElementById('learningContainer'); container.className = "grid grid-cols-1 sm:grid-cols-2 gap-4"; container.innerHTML = '';
      const categories = [...new Set(allTheories.map(t => t.category))].sort((a, b) => {
        let idxA = FIXED_CATEGORIES.indexOf(a); let idxB = FIXED_CATEGORIES.indexOf(b); return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
      });
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-emerald-500 dark:hover:border-emerald-400 p-6 rounded-2xl text-left transition flex justify-between items-center group";
        btn.onclick = () => navTo('view-learning', { level: 'category', category: cat });
        const count = allTheories.filter(t => t.category === cat).length;
        btn.innerHTML = `<div><h3 class="text-lg font-bold text-slate-800 dark:text-white">${cat}</h3><span class="text-xs text-slate-400 mt-1 block">총 ${count}개의 문서</span></div><span class="text-slate-300 group-hover:text-emerald-500 text-xl font-bold">➔</span>`;
        container.appendChild(btn);
      });
    }

    function renderSubjectsDOM(category) {
      renderBreadcrumb();
      const container = document.getElementById('learningContainer'); container.className = "grid grid-cols-1 sm:grid-cols-2 gap-4"; container.innerHTML = '';
      const filtered = allTheories.filter(t => t.category === category);
      const subjects = [...new Set(filtered.map(t => t.subject))].sort((a, b) => {
        let idxA = FIXED_SUBJECTS.indexOf(a); let idxB = FIXED_SUBJECTS.indexOf(b); return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
      });
      subjects.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-emerald-50 p-5 rounded-2xl text-left transition";
        btn.onclick = () => navTo('view-learning', { level: 'subject', category: category, subject: sub });
        const count = filtered.filter(t => t.subject === sub).length;
        btn.innerHTML = `<h3 class="text-base font-bold text-emerald-800 dark:text-emerald-400">${sub}</h3><span class="text-xs text-slate-500 block mt-1">세부 문서 ${count}개 보기</span>`;
        container.appendChild(btn);
      });
    }

    function renderTitlesDOM(category, subject) {
      renderBreadcrumb();
      const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-3"; container.innerHTML = '';
      allTheories.filter(t => t.category === category && t.subject === subject).forEach(t => renderTitleCard(t, container));
    }

    function renderTitleCard(t, container) {
      const btn = document.createElement('button');
      btn.className = "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-emerald-400 p-5 rounded-xl text-left transition flex items-start w-full";
      btn.onclick = () => navTo('view-learning', { level: 'detail', theoryId: t.id });
      btn.innerHTML = `<span class="text-xl mr-3">📄</span><div><h3 class="text-slate-800 dark:text-white font-bold leading-snug">${t.title}</h3><div class="mt-2 flex flex-wrap gap-1">${(t.tags || []).map(tag => `<span class="bg-slate-100 dark:bg-slate-700 text-slate-500 text-[10px] px-1.5 py-0.5 rounded font-medium">#${tag}</span>`).join('')}</div></div>`;
      container.appendChild(btn);
    }

    // ✨ 마크다운 렌더링 & 미니 모의고사 연동
    function renderDetailDOM(theoryId) {
      const t = allTheories.find(x => x.id === theoryId);
      const container = document.getElementById('learningContainer');
      container.className = "flex flex-col space-y-4"; container.innerHTML = '';
      
      const card = document.createElement('div');
      card.className = "bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden";
      
      const tagsHtml = (t.tags || []).map(tag => `<span class="inline-block bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 font-bold text-xs px-2 py-1 rounded-md mr-1 mb-2">#${tag}</span>`).join('');
      
      // marked.js를 활용한 마크다운 파싱 + Tailwind Typography(prose) 클래스 적용
      const parsedMarkdown = marked.parse(t.content);
      
      card.innerHTML = `
        <div class="p-6">
          <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-3 leading-snug">${t.title}</h2>
          <div class="mb-5 pb-3 border-b border-slate-100 dark:border-slate-700">${tagsHtml}</div>
          <!-- 마크다운이 예쁘게 렌더링되는 핵심 영역 -->
          <div class="prose prose-slate dark:prose-invert prose-sm sm:prose-base max-w-none prose-headings:text-indigo-800 dark:prose-headings:text-indigo-400 prose-a:text-emerald-600 prose-table:border-collapse prose-th:bg-slate-100 dark:prose-th:bg-slate-700 prose-th:p-2 prose-td:border prose-td:border-slate-200 dark:prose-td:border-slate-600 prose-td:p-2">
            ${parsedMarkdown}
          </div>
        </div>
        <!-- 연동 모의고사 버튼 -->
        <div class="bg-slate-50 dark:bg-slate-700/50 p-6 border-t border-slate-200 dark:border-slate-700">
          <button onclick="startMiniQuiz('${t.subject}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
            <span class="text-xl">🧩</span> 방금 읽은 개념이 적용된 실전 문제 풀기 ➔
          </button>
        </div>
      `;
      container.appendChild(card);
    }

    // ✨ 미니 모의고사 실행 로직
    function startMiniQuiz(subjectKeyword) {
      filteredSession = allQuizData.filter(q => q.category.includes(subjectKeyword) || q.topic.includes(subjectKeyword));
      if (filteredSession.length === 0) {
        alert("현재 등록된 관련된 기출문제가 없습니다."); return;
      }
      // 관련 문제 중 랜덤 3개만 추출
      filteredSession = filteredSession.sort(() => Math.random() - 0.5).slice(0, 3);
      currentIndex = 0; correctCount = 0; currentMode = 'quiz';
      navTo('view-quiz');
      renderQuiz();
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumbContainer'); bc.classList.remove('hidden');
      bc.innerHTML = `<button onclick="navTo('view-learning', {level:'home'})" class="text-emerald-700 dark:text-emerald-400 hover:text-emerald-900 font-bold text-sm px-2">📖 홈</button>`;
      if (learnState.level !== 'home') bc.innerHTML += `<span class="text-emerald-300 dark:text-emerald-700 font-bold">❯</span><button onclick="navTo('view-learning', {level:'category', category: '${learnState.category}'})" class="text-emerald-900 dark:text-emerald-200 font-bold text-sm px-2 hover:underline">${learnState.category}</button>`;
      if (learnState.level === 'subject' || learnState.level === 'detail') bc.innerHTML += `<span class="text-emerald-300 dark:text-emerald-700 font-bold">❯</span><button onclick="navTo('view-learning', {level:'subject', category: '${learnState.category}', subject: '${learnState.subject}'})" class="text-emerald-900 dark:text-emerald-200 font-bold text-sm px-2 hover:underline">${learnState.subject}</button>`;
    }

    function handleTheorySearch() {
      const query = document.getElementById('theorySearchInput').value.trim().toLowerCase();
      if (!query) { applyState('view-learning', learnState); return; }
      document.getElementById('breadcrumbContainer').classList.add('hidden');
      const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-3"; container.innerHTML = '';
      const results = allTheories.filter(t => t.title.toLowerCase().includes(query) || t.content.toLowerCase().includes(query) || (t.tags && t.tags.some(tag => tag.toLowerCase().includes(query))));
      if (results.length === 0) { container.innerHTML = `<div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-6 text-center text-slate-500 text-sm">검색 결과가 없습니다.</div>`; return; }
      results.forEach(t => renderTitleCard(t, container));
    }

    // ==========================================
    // ⭐ 오답노트 / 시험 세션 로직 (기존 유지)
    // ==========================================
    function renderNoteDOM() {
      const container = document.getElementById('noteContainer'); container.innerHTML = '';
      const savedQuestions = allQuizData.filter(q => starredIds.includes(q.id));
      if (savedQuestions.length === 0) { container.innerHTML = `<div class="bg-white dark:bg-slate-800 p-6 rounded-2xl text-center text-slate-500 border border-slate-200 dark:border-slate-700">저장된 문제가 없습니다.</div>`; return; }
      savedQuestions.forEach(q => {
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 p-5";
        card.innerHTML = `<div class="flex justify-between items-start mb-3"><span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded">${q.category || '통합'}</span><button onclick="removeNote('${q.id}')" class="text-xs text-slate-400 hover:text-rose-500 font-bold underline">삭제</button></div><h3 class="text-base font-bold text-slate-900 dark:text-white mb-4">${q.question}</h3><button onclick="toggleNoteAnswer('${q.id}')" id="btn-${q.id}" class="w-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 text-sm font-bold py-2 rounded-lg mb-2">정답 보기 ⬇️</button><div id="ans-${q.id}" class="hidden bg-slate-50 dark:bg-slate-700/50 p-4 rounded-lg mt-3"><span class="text-sm font-bold text-emerald-600 mb-2 block">정답: ${q.options[q.answer]}</span><p class="text-sm text-slate-600 dark:text-slate-300 mb-4">${q.explanation}</p></div>`;
        container.appendChild(card);
      });
    }
    function toggleNoteAnswer(id) { const ansDiv = document.getElementById(`ans-${id}`); const btn = document.getElementById(`btn-${id}`); if (ansDiv.classList.contains('hidden')) { ansDiv.classList.remove('hidden'); btn.innerHTML = "해설 닫기 ⬆️"; } else { ansDiv.classList.add('hidden'); btn.innerHTML = "정답 보기 ⬇️"; } }
    function removeNote(id) { starredIds = starredIds.filter(savedId => savedId !== id); localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds)); renderNoteDOM(); }
    function toggleStar() {
      const currentQId = filteredSession[currentIndex].id; const starBtn = document.getElementById('starBtn');
      if (starredIds.includes(currentQId)) { starredIds = starredIds.filter(id => id !== currentQId); starBtn.innerText = "☆"; starBtn.classList.replace('text-amber-400', 'text-slate-200'); starBtn.classList.replace('dark:text-amber-400', 'dark:text-slate-600'); } 
      else { starredIds.push(currentQId); starBtn.innerText = "★"; starBtn.classList.replace('text-slate-200', 'text-amber-400'); starBtn.classList.replace('dark:text-slate-600', 'dark:text-amber-400'); }
      localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds));
    }

    function openSetup(mode) { currentMode = mode; document.getElementById('setupTitle').innerText = mode === 'quiz' ? "📝 객관식 설정" : "🗣️ 면접 대비 설정"; navTo('view-setup'); }
    function startSession() {
      const subject = document.getElementById('select-subject').value; const count = document.getElementById('select-count').value;
      const dataSource = currentMode === 'quiz' ? allQuizData : allInterviewData;
      filteredSession = dataSource.filter(q => subject === "ALL" || (q.category && q.category.includes(subject)));
      if (filteredSession.length === 0) return alert("해당 조건의 문항이 없습니다.");
      filteredSession = filteredSession.sort(() => Math.random() - 0.5);
      if (count !== "ALL") filteredSession = filteredSession.slice(0, parseInt(count));
      currentIndex = 0; correctCount = 0; navTo(currentMode === 'quiz' ? 'view-quiz' : 'view-interview');
      if (currentMode === 'quiz') renderQuiz(); else renderInterview();
    }

    function renderQuiz() {
      const q = filteredSession[currentIndex];
      document.getElementById('qBadge').innerText = `${q.category} (${q.difficulty})`; document.getElementById('qProgress').innerText = `${currentIndex + 1} / ${filteredSession.length}`; document.getElementById('qTitle').innerText = q.question;
      const starBtn = document.getElementById('starBtn');
      if (starredIds.includes(q.id)) { starBtn.innerText = "★"; starBtn.className = "text-3xl text-amber-400 hover:text-amber-500 transition ml-3 -mt-1 outline-none"; } else { starBtn.innerText = "☆"; starBtn.className = "text-3xl text-slate-200 dark:text-slate-600 hover:text-amber-400 transition ml-3 -mt-1 outline-none"; }
      const optContainer = document.getElementById('qOptions'); optContainer.innerHTML = ''; document.getElementById('qExpBox').classList.add('hidden');
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button'); btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 font-medium text-sm flex items-center";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 flex items-center justify-center text-xs mr-3 font-bold">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => checkAnswer(idx, q); optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx, q) {
      Array.from(document.getElementById('qOptions').children).forEach(btn => btn.disabled = true); document.getElementById('qExpBox').classList.remove('hidden');
      const status = document.getElementById('qStatus');
      if (selectedIdx === q.answer) { correctCount++; status.className = "font-bold text-sm mb-1 text-emerald-600"; status.innerText = "⭕ 정답입니다!"; } 
      else { status.className = "font-bold text-sm mb-1 text-rose-600"; status.innerText = `❌ 오답 (정답: ${q.answer + 1}번)`; }
      document.getElementById('qExpText').innerText = q.explanation;
      const nextBtn = document.getElementById('qNextBtn');
      if (currentIndex === filteredSession.length - 1) { nextBtn.innerText = "종료 및 결과 보기"; nextBtn.onclick = () => finishQuiz(); } else { nextBtn.innerText = "다음 문제"; nextBtn.onclick = () => { currentIndex++; renderQuiz(); }; }
    }
    function finishQuiz() { navTo('view-result'); document.getElementById('scoreText').innerText = Math.round((correctCount / filteredSession.length) * 100); document.getElementById('scoreDetail').innerText = `총 ${filteredSession.length}문제 중 ${correctCount}문제를 맞혔습니다.`; }

    function renderInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iBadge').innerText = `${i.category}`; document.getElementById('iProgress').innerText = `${currentIndex + 1} / ${filteredSession.length}`; document.getElementById('iTitle').innerText = i.question;
      document.getElementById('iRevealBtn').classList.remove('hidden'); document.getElementById('iExpBox').classList.add('hidden');
    }
    function revealInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iRevealBtn').classList.add('hidden'); document.getElementById('iExpBox').classList.remove('hidden');
      const kwContainer = document.getElementById('iKeywords'); kwContainer.innerHTML = (i.key_points || []).map(k => `<span class="bg-rose-100 dark:bg-rose-900/40 text-rose-700 dark:text-rose-300 text-[11px] px-2 py-1 rounded font-bold">#${k}</span>`).join('');
      document.getElementById('iAnsText').innerText = i.interview_answer;
      const nextBtn = document.getElementById('iNextBtn');
      if (currentIndex === filteredSession.length - 1) { nextBtn.innerText = "면접 훈련 완료"; nextBtn.onclick = () => navTo('view-lobby'); } else { nextBtn.innerText = "다음 문항"; nextBtn.onclick = () => { currentIndex++; renderInterview(); }; }
    }

    function openReportModal() { document.getElementById('reportModal').classList.replace('hidden', 'flex'); document.getElementById('reportContent').value = ''; }
    function closeReportModal() { document.getElementById('reportModal').classList.replace('flex', 'hidden'); }
    async function submitReport() {
      const content = document.getElementById('reportContent').value.trim();
      if(!content) return alert("오류 내용을 입력해주세요."); if(!supabaseClient) return alert("DB에 연결할 수 없습니다.");
      const item = filteredSession[currentIndex]; const submitBtn = document.getElementById('submitReportBtn'); submitBtn.innerText = "전송 중...";
      try { await supabaseClient.from('error_reports').insert([{ question_id: item.id, content: content }]); alert("✅ 접수 완료!"); closeReportModal(); } catch (e) { alert("전송 실패"); }
      submitBtn.innerText = "제출하기";
    }

    initApp();
  </script>
</body>
</html>
