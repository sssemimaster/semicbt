<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 반도체 직무 전공 AI 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center relative z-10">
    <h1 class="text-xl font-bold tracking-tight cursor-pointer" onclick="changeView('view-lobby')">⚡ SemiCBT</h1>
    <button class="bg-indigo-700 hover:bg-indigo-600 text-xs px-3 py-1.5 rounded-lg transition" onclick="changeView('view-lobby')">🏠 홈으로</button>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center py-8">
    
    <!-- [화면 1] 메인 로비 -->
    <div id="view-lobby" class="w-full flex flex-col space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center mb-4">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">반도체 취업 마스터</h2>
        <p class="text-slate-500 text-sm">원하는 학습 모드를 선택하세요.</p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="startLearning()" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">📖</span>
          <span class="font-bold text-sm">이론 백과사전</span>
        </button>
        <button onclick="openNote()" class="bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">⭐</span>
          <span class="font-bold text-sm">오답 / 북마크</span>
        </button>
      </div>
      <button onclick="changeView('view-setup')" class="w-full bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
        <span class="text-3xl mb-2">📝</span>
        <span class="font-bold text-lg">실전 모의고사 (CBT)</span>
      </button>
    </div>

    <!-- [화면 2] 시험 설정 -->
    <div id="view-setup" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 뒤로</button>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-xl font-bold text-slate-800 mb-6">모의고사 설정</h2>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-slate-700 mb-2">과목 선택</label>
          <select id="select-subject" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
            <option value="ALL">✨ 전체 과목 통합</option>
            <option value="반도체 기초 이론">반도체 기초 이론</option>
            <option value="반도체 8대 공정">반도체 8대 공정</option>
            <option value="차세대 첨단 기술">차세대 첨단 기술</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-slate-700 mb-2">난이도 선택</label>
          <select id="select-difficulty" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
            <option value="ALL">✨ 전체 난이도</option>
            <option value="초급">초급</option>
            <option value="중급">중급</option>
            <option value="고급">고급</option>
          </select>
        </div>
        <div class="mb-8">
          <label class="block text-sm font-semibold text-slate-700 mb-2">문제 수 선택</label>
          <select id="select-count" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
            <option value="ALL">최대 (모두 풀기)</option>
            <option value="5">5문제</option>
            <option value="10">10문제</option>
          </select>
        </div>
        <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">시험 시작하기</button>
      </div>
    </div>

    <!-- [화면 3] 문제 풀이 영역 -->
    <div id="view-quiz" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 뒤로</button>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <span id="categoryBadge" class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded mr-2">과목명</span>
            <span id="progressText" class="text-xs text-slate-400 font-medium">1 / 10</span>
          </div>
          <button onclick="toggleMode()" id="modeToggleBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg transition border border-slate-200">🔄 면접 모드</button>
        </div>
        <div class="flex justify-between items-start mb-6">
          <h2 id="questionTitle" class="text-lg font-bold text-slate-900 leading-snug flex-1">문제 지문</h2>
          <button onclick="toggleStar()" id="starBtn" class="text-3xl text-slate-200 hover:text-amber-400 transition ml-3 -mt-1 outline-none">☆</button>
        </div>
        <div id="optionsContainer" class="space-y-3"></div>
        <div id="flashcardContainer" class="hidden">
          <button id="revealBtn" onclick="revealFlashcard()" class="w-full bg-indigo-50 hover:bg-indigo-100 border-2 border-dashed border-indigo-300 text-indigo-700 font-bold py-12 rounded-xl transition flex flex-col items-center justify-center">
            <span class="text-3xl mb-2">🤔</span><span>스스로 답변을 생각해본 뒤 클릭하세요</span>
          </button>
        </div>
        <div id="explanationBox" class="mt-6 p-4 bg-slate-50 border border-slate-200 rounded-xl hidden">
          <div id="resultStatus" class="font-bold text-sm mb-2"></div>
          <div id="keywordTags" class="mb-3 hidden"></div>
          <p id="explanationText" class="text-sm text-slate-600 leading-relaxed"></p>
          <button id="nextBtn" onclick="nextQuestion()" class="mt-4 w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">다음 문제</button>
        </div>
      </div>
    </div>

    <!-- ✨ [화면 4] 무한 뎁스 백과사전 + 검색 UI -->
    <div id="view-learning" class="hidden w-full flex flex-col">
      <!-- ⬅️ 뒤로 버튼을 외부로 따로 빼서 독립적으로 배치 (레이아웃 틀어짐 방지) -->
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 뒤로</button>
      
      <div class="mb-4 relative">
        <input type="text" id="theorySearchInput" onkeyup="handleTheorySearch()" placeholder="🔍 키워드, 기술명, 공정 검색..." class="w-full bg-white border border-slate-200 text-slate-700 rounded-xl p-4 shadow-sm outline-none focus:border-emerald-500 transition font-medium">
      </div>
      
      <div id="breadcrumbContainer" class="bg-emerald-50 rounded-xl border border-emerald-200 p-3 mb-4 flex flex-wrap items-center shadow-sm gap-y-2"></div>
      
      <div id="learningContainer" class="grid grid-cols-1 gap-4"></div>
    </div>

    <!-- [화면 5] 오답노트 -->
    <div id="view-note" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 뒤로</button>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-4 text-center">
        <h2 class="text-xl font-bold text-slate-800">⭐ 나의 오답 / 북마크 노트</h2>
      </div>
      <div id="noteContainer" class="space-y-4"></div>
    </div>

    <!-- [화면 6] 결과 -->
    <div id="view-result" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 홈으로</button>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">모의고사 완료!</h2>
        <div class="flex justify-center items-center my-6">
          <div class="w-32 h-32 rounded-full border-8 border-indigo-500 flex flex-col items-center justify-center">
            <span id="scoreText" class="text-3xl font-black text-indigo-600">80</span>
            <span class="text-sm text-slate-500 font-bold">% 정답률</span>
          </div>
        </div>
        <p id="scoreDetail" class="text-base text-slate-600 font-medium mb-6">결과 내역</p>
        <button onclick="changeView('view-lobby')" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md">메인 로비로 돌아가기</button>
      </div>
    </div>

  </main>

  <script>
    let allQuizData = [];    
    let allTheories = [];    
    let filteredQuiz = [];   
    let currentIndex = 0;    
    let isFlashcardMode = false;
    let correctCount = 0;
    let starredIds = JSON.parse(localStorage.getItem('semiCbtStarred')) || [];

    // 상태 관리 변수 (지능형 뒤로가기를 위해 현재 위치 추적)
    let currentPath = []; 
    let currentViewId = 'view-lobby';
    let isDetailView = false; 

    async function initApp() {
      try {
        const timestamp = new Date().getTime();
        let qUrl = `./data/questions.json?t=${timestamp}`;
        let tUrl = `./data/theories.json?t=${timestamp}`;
        const host = window.location.hostname;
        const path = window.location.pathname.split('/')[1];

        if (host.includes("github.io")) {
          const username = host.split('.')[0];
          qUrl = `https://raw.githubusercontent.com/${username}/${path}/main/data/questions.json?t=${timestamp}`;
          tUrl = `https://raw.githubusercontent.com/${username}/${path}/main/data/theories.json?t=${timestamp}`;
        }

        const [quizRes, theoryRes] = await Promise.all([
          fetch(qUrl).then(res => res.ok ? res : fetch(`./data/questions.json?t=${timestamp}`)),
          fetch(tUrl).then(res => res.ok ? res : fetch(`./data/theories.json?t=${timestamp}`))
        ]);

        allQuizData = await quizRes.json();
        const rawTheories = await theoryRes.json();
        
        allTheories = rawTheories.map((t, idx) => {
          let mergedPath = t.path;
          if (!mergedPath) {
            mergedPath = [t.category || "기타", t.subject || "일반"];
          }
          return { ...t, id: "T-" + idx, path: mergedPath };
        });
      } catch (error) { console.error("데이터 로드 실패:", error); }
    }

    function changeView(viewId) {
      ['view-lobby', 'view-setup', 'view-quiz', 'view-learning', 'view-note', 'view-result'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
      
      currentViewId = viewId;
      isDetailView = false; 
    }

    // 지능형 전역 뒤로가기 로직
    function goBack() {
      if (currentViewId === 'view-setup' || currentViewId === 'view-note' || currentViewId === 'view-result') {
        changeView('view-lobby');
      } else if (currentViewId === 'view-quiz') {
        if (confirm("시험을 중단하고 설정 화면으로 돌아가시겠습니까?")) {
          changeView('view-setup');
        }
      } else if (currentViewId === 'view-learning') {
        if (document.getElementById('theorySearchInput').value.trim() !== '') {
          document.getElementById('theorySearchInput').value = '';
          renderDirectory(currentPath);
        } else if (isDetailView) {
          renderDirectory(currentPath); 
        } else if (currentPath.length > 0) {
          renderDirectory(currentPath.slice(0, -1)); 
        } else {
          changeView('view-lobby'); 
        }
      }
    }

    /* ==========================================
       이론 백과사전 엔진 (무한 뎁스)
       ========================================== */
    function startLearning() {
      changeView('view-learning');
      document.getElementById('theorySearchInput').value = ''; 
      renderDirectory([]); 
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumbContainer');
      bc.classList.remove('hidden');
      bc.innerHTML = `<button onclick="renderDirectory([])" class="text-emerald-700 hover:text-emerald-900 font-bold text-sm px-2">📖 홈</button>`;
      
      currentPath.forEach((folder, idx) => {
        bc.innerHTML += `<span class="text-emerald-300 font-bold">❯</span>`;
        const pathSoFar = JSON.stringify(currentPath.slice(0, idx + 1));
        bc.innerHTML += `<button onclick='renderDirectory(${pathSoFar})' class="text-emerald-900 font-bold text-sm px-2 hover:underline">${folder}</button>`;
      });
    }

    function renderDirectory(pathArray) {
      currentPath = pathArray;
      isDetailView = false;
      renderBreadcrumb();
      
      const container = document.getElementById('learningContainer');
      container.innerHTML = '';
      
      const matchingTheories = allTheories.filter(t => {
        for(let i = 0; i < currentPath.length; i++) {
          if (t.path[i] !== currentPath[i]) return false;
        }
        return true;
      });
      
      const depth = currentPath.length;
      const subFolders = [...new Set(matchingTheories.map(t => t.path[depth]).filter(Boolean))];
      
      if (subFolders.length > 0) {
        container.className = "grid grid-cols-1 sm:grid-cols-2 gap-4";
        subFolders.forEach(folder => {
          const btn = document.createElement('button');
          btn.className = "bg-white border border-slate-200 hover:border-emerald-500 hover:shadow-md p-5 rounded-2xl text-left transition flex justify-between items-center group";
          const nextPath = JSON.stringify([...currentPath, folder]);
          btn.onclick = () => renderDirectory(JSON.parse(nextPath));
          btn.innerHTML = `<h3 class="text-base font-bold text-slate-800">${folder}</h3><span class="text-slate-300 group-hover:text-emerald-500 text-xl font-bold">➔</span>`;
          container.appendChild(btn);
        });
      } else {
        container.className = "flex flex-col space-y-3"; 
        matchingTheories.forEach(t => renderTitleCard(t, container));
      }
    }

    function renderTitleCard(t, container) {
      const btn = document.createElement('button');
      btn.className = "bg-white border border-slate-200 hover:border-emerald-400 p-5 rounded-xl text-left transition flex items-start w-full";
      btn.onclick = () => renderDetail(t.id);
      btn.innerHTML = `
        <span class="text-xl mr-3">📄</span>
        <div>
          <h3 class="text-slate-800 font-bold leading-snug">${t.title}</h3>
          <div class="mt-2 flex flex-wrap gap-1">
            ${(t.tags || []).map(tag => `<span class="bg-slate-100 text-slate-500 text-[10px] px-1.5 py-0.5 rounded font-medium">#${tag}</span>`).join('')}
          </div>
        </div>
      `;
      container.appendChild(btn);
    }

    function renderDetail(theoryId) {
      isDetailView = true;
      const t = allTheories.find(x => x.id === theoryId);
      const container = document.getElementById('learningContainer');
      container.className = "flex flex-col space-y-4";
      container.innerHTML = '';
      
      const card = document.createElement('div');
      card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-6";
      const formattedContent = t.content.replace(/\n/g, '<br>');
      const tagsHtml = (t.tags || []).map(tag => `<span class="inline-block bg-slate-100 text-slate-500 text-xs px-2 py-1 rounded-md mr-1 mb-2">#${tag}</span>`).join('');
      
      card.innerHTML = `
        <h2 class="text-xl font-black text-slate-900 mb-4 leading-snug">${t.title}</h2>
        <div class="mb-5 border-b border-slate-100 pb-3">${tagsHtml}</div>
        <p class="text-sm text-slate-700 leading-relaxed">${formattedContent}</p>
      `;
      container.appendChild(card);
    }

    function handleTheorySearch() {
      const query = document.getElementById('theorySearchInput').value.trim().toLowerCase();
      if (!query) {
        renderDirectory(currentPath);
        return;
      }
      
      isDetailView = false;
      document.getElementById('breadcrumbContainer').classList.add('hidden');
      const container = document.getElementById('learningContainer');
      container.className = "flex flex-col space-y-3"; 
      container.innerHTML = '';
      
      const results = allTheories.filter(t => 
        t.title.toLowerCase().includes(query) || 
        t.content.toLowerCase().includes(query) || 
        (t.tags && t.tags.some(tag => tag.toLowerCase().includes(query))) ||
        (t.path && t.path.some(p => p.toLowerCase().includes(query)))
      );
      
      if (results.length === 0) {
        container.innerHTML = `<div class="bg-white border border-slate-200 rounded-xl p-6 text-center text-slate-500 text-sm">검색 결과가 없습니다.</div>`;
        return;
      }
      results.forEach(t => renderTitleCard(t, container));
    }

    /* ==========================================
       모의고사 및 오답노트 로직
       ========================================== */
    function openNote() {
      changeView('view-note');
      const container = document.getElementById('noteContainer');
      container.innerHTML = '';
      const savedQuestions = allQuizData.filter(q => starredIds.includes(q.id));
      if (savedQuestions.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-500 border border-slate-200">저장된 문제가 없습니다.</div>`;
        return;
      }
      savedQuestions.forEach(q => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 p-5";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="bg-amber-100 text-amber-700 text-xs font-bold px-2 py-1 rounded">${q.category || '통합'}</span>
            <button onclick="removeNote('${q.id}')" class="text-xs text-slate-400 hover:text-rose-500 font-bold underline">삭제</button>
          </div>
          <h3 class="text-base font-bold text-slate-900 mb-4">${q.question}</h3>
          <button onclick="toggleNoteAnswer('${q.id}')" id="btn-${q.id}" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 text-sm font-bold py-2 rounded-lg transition mb-2">정답 및 해설 보기 ⬇️</button>
          <div id="ans-${q.id}" class="hidden bg-slate-50 p-4 rounded-lg border border-slate-200 mt-3 transition-all">
            <span class="text-sm font-bold text-emerald-600 mb-2 block">정답: ${q.options[q.answer]}</span>
            <p class="text-sm text-slate-600 mb-4">${q.explanation}</p>
            <div class="border-t border-slate-200 pt-3 mt-2"><span class="text-xs font-bold text-indigo-700 mb-1 block">🗣️ 면접 핵심 스크립트</span><p class="text-sm text-slate-800 font-medium">"${q.interview_answer || q.explanation}"</p></div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleNoteAnswer(id) {
      const ansDiv = document.getElementById(`ans-${id}`);
      const btn = document.getElementById(`btn-${id}`);
      if (ansDiv.classList.contains('hidden')) {
        ansDiv.classList.remove('hidden');
        btn.innerHTML = "해설 닫기 ⬆️";
      } else {
        ansDiv.classList.add('hidden');
        btn.innerHTML = "정답 및 해설 보기 ⬇️";
      }
    }

    function removeNote(id) {
      starredIds = starredIds.filter(savedId => savedId !== id);
      localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds));
      openNote(); 
    }

    function startQuiz() {
      const selectedSubject = document.getElementById('select-subject').value;
      const selectedDifficulty = document.getElementById('select-difficulty').value;
      const selectedCount = document.getElementById('select-count').value;

      filteredQuiz = allQuizData.filter(q => {
        const matchSubj = (selectedSubject === "ALL" || (q.category && q.category.includes(selectedSubject)) || (q.topic && q.topic.includes(selectedSubject)));
        const matchDiff = (selectedDifficulty === "ALL" || q.difficulty === selectedDifficulty);
        return matchSubj && matchDiff;
      });

      if (filteredQuiz.length === 0) {
        alert(`선택하신 조건에 맞는 문제가 없습니다.\n(현재 로드된 전체 문제 수: ${allQuizData.length}개)`);
        return;
      }
      
      filteredQuiz = filteredQuiz.sort(() => Math.random() - 0.5);
      if (selectedCount !== "ALL") {
        filteredQuiz = filteredQuiz.slice(0, parseInt(selectedCount));
      }
      currentIndex = 0; correctCount = 0; isFlashcardMode = false;
      document.getElementById('modeToggleBtn').innerText = "🔄 면접 모드";
      changeView('view-quiz');
      renderQuestion();
    }

    function toggleMode() {
      isFlashcardMode = !isFlashcardMode;
      document.getElementById('modeToggleBtn').innerText = isFlashcardMode ? "🔄 객관식 모드" : "🔄 면접 모드";
      renderQuestion();
    }

    function toggleStar() {
      const currentQId = filteredQuiz[currentIndex].id;
      const starBtn = document.getElementById('starBtn');
      if (starredIds.includes(currentQId)) {
        starredIds = starredIds.filter(id => id !== currentQId);
        starBtn.innerText = "☆"; starBtn.classList.replace('text-amber-400', 'text-slate-200');
      } else {
        starredIds.push(currentQId);
        starBtn.innerText = "★"; starBtn.classList.replace('text-slate-200', 'text-amber-400');
      }
      localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds));
    }

    function renderQuestion() {
      const q = filteredQuiz[currentIndex];
      document.getElementById('categoryBadge').innerText = `${q.category || '통합'} (${q.difficulty || '중급'})`;
      document.getElementById('progressText').innerText = `문제 ${currentIndex + 1} / ${filteredQuiz.length}`;
      document.getElementById('questionTitle').innerText = q.question;
      const starBtn = document.getElementById('starBtn');
      if (starredIds.includes(q.id)) {
        starBtn.innerText = "★"; starBtn.className = "text-3xl text-amber-400 hover:text-amber-500 transition ml-3 -mt-1 outline-none";
      } else {
        starBtn.innerText = "☆"; starBtn.className = "text-3xl text-slate-200 hover:text-amber-400 transition ml-3 -mt-1 outline-none";
      }
      const optContainer = document.getElementById('optionsContainer');
      const flashContainer = document.getElementById('flashcardContainer');
      const expBox = document.getElementById('explanationBox');
      optContainer.innerHTML = ''; expBox.classList.add('hidden'); document.getElementById('keywordTags').classList.add('hidden');
      
      if (isFlashcardMode) {
        optContainer.classList.add('hidden'); flashContainer.classList.remove('hidden');
        document.getElementById('revealBtn').classList.remove('hidden');
      } else {
        flashContainer.classList.add('hidden'); optContainer.classList.remove('hidden');
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 transition font-medium text-sm text-slate-700 flex items-center";
          btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs mr-3 font-semibold flex-shrink-0">${idx + 1}</span> <span>${opt}</span>`;
          btn.onclick = () => checkAnswer(idx);
          optContainer.appendChild(btn);
        });
      }
    }

    function revealFlashcard() {
      const q = filteredQuiz[currentIndex];
      const box = document.getElementById('explanationBox');
      const status = document.getElementById('resultStatus');
      const text = document.getElementById('explanationText');
      const keywordBox = document.getElementById('keywordTags');
      document.getElementById('revealBtn').classList.add('hidden');
      status.className = "font-bold text-sm mb-2 text-indigo-700"; status.innerText = "🗣️ 면접관이 기대한 핵심 답변";
      text.innerHTML = q.interview_answer ? `<span class="text-slate-800 font-medium">" ${q.interview_answer} "</span>` : q.explanation;
      if (q.flashcard_keywords?.length) {
        keywordBox.classList.remove('hidden');
        keywordBox.innerHTML = q.flashcard_keywords.map(kw => `<span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded mr-2 mb-2">#${kw}</span>`).join('');
      } else { keywordBox.classList.add('hidden'); }
      box.classList.remove('hidden'); updateNextButton();
    }

    function checkAnswer(selectedIndex) {
      const q = filteredQuiz[currentIndex];
      const box = document.getElementById('explanationBox');
      const status = document.getElementById('resultStatus');
      const text = document.getElementById('explanationText');
      Array.from(document.getElementById('optionsContainer').children).forEach(btn => btn.disabled = true);
      box.classList.remove('hidden'); document.getElementById('keywordTags').classList.add('hidden');
      if (selectedIndex === q.answer) {
        correctCount++; status.className = "font-bold text-sm mb-1 text-emerald-600"; status.innerText = "⭕ 정답입니다!";
      } else {
        status.className = "font-bold text-sm mb-1 text-rose-600"; status.innerText = `❌ 오답입니다. (정답: ${q.answer + 1}번)`;
      }
      text.innerText = q.explanation; updateNextButton();
    }

    function updateNextButton() {
      const nextBtn = document.getElementById('nextBtn');
      if (currentIndex === filteredQuiz.length - 1) {
        nextBtn.innerText = "시험 종료 및 결과 보기";
        nextBtn.className = "mt-4 w-full bg-slate-800 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-900 transition";
      } else {
        nextBtn.innerText = "다음 문제";
        nextBtn.className = "mt-4 w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition";
      }
    }

    function nextQuestion() {
      if (currentIndex < filteredQuiz.length - 1) {
        currentIndex++; renderQuestion();
      } else {
        changeView('view-result');
        const score = Math.round((correctCount / filteredQuiz.length) * 100);
        document.getElementById('scoreText').innerText = score;
        document.getElementById('scoreDetail').innerText = `총 ${filteredQuiz.length}문제 중 ${correctCount}문제를 맞혔습니다.`;
      }
    }

    initApp();
  </script>
</body>
</html>
