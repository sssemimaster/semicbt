<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 반도체 직무 전공 AI 플랫폼</title>
  
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>tailwind.config = { darkMode: 'class', }</script>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 수식 렌더링 (KaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* ===== 라이트/다크 색상 토큰 (html.dark 일 때 아래 값으로 바뀜) ===== */
    :root {
      color-scheme: light;
      --hl-bg: #ecfdf5; --hl-border: #a7f3d0; --hl-accent: #10b981; --hl-text: #1f2937;
      --badge-bg: #d1fae5; --badge-fg: #047857;
      --heading: #0f172a;
      --tbl-bg: #ffffff; --tbl-border: #e2e8f0; --tbl-head-bg: #ecfdf5; --tbl-head-fg: #047857; --tbl-text: #334155;
    }
    html.dark {
      color-scheme: dark;
      --hl-bg: #1a231c; --hl-border: #2d4a36; --hl-accent: #84cc9c; --hl-text: #e2e8f0;
      --badge-bg: #2d4a36; --badge-fg: #84cc9c;
      --heading: #f8fafc;
      --tbl-bg: #1e293b; --tbl-border: #334155; --tbl-head-bg: #253328; --tbl-head-fg: #84cc9c; --tbl-text: #cbd5e1;
    }

    /* 하이라이트 박스 & 뱃지 커스텀 */
    .custom-highlight-box { background-color: var(--hl-bg); border: 1px solid var(--hl-border); border-left: 6px solid var(--hl-accent); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 2rem; color: var(--hl-text); display: flex; gap: 12px; font-size: 0.95rem; line-height: 1.6;}
    .custom-highlight-box::before { content: '💡'; font-size: 1.25rem; }
    .custom-badge-heading { display: flex; align-items: center; gap: 10px; margin-top: 2.5rem; margin-bottom: 1.25rem; font-size: 1.15rem; font-weight: 800; color: var(--heading); }
    .custom-badge { background-color: var(--badge-bg); color: var(--badge-fg); font-size: 0.75rem; padding: 4px 10px; border-radius: 9999px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .custom-badge::before { content: ''; display: inline-block; width: 6px; height: 6px; background-color: var(--badge-fg); border-radius: 50%; }
    .custom-table-container table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--tbl-border); border-radius: 12px; overflow: hidden; margin-top: 1rem; margin-bottom: 2rem; background-color: var(--tbl-bg); font-size: 0.9rem;}
    .custom-table-container th { background-color: var(--tbl-head-bg); color: var(--tbl-head-fg); text-align: left; padding: 0.75rem 1rem; font-weight: 700; border-bottom: 1px solid var(--tbl-border); }
    .custom-table-container td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--tbl-border); color: var(--tbl-text); }
    .custom-table-container tr:last-child td { border-bottom: 0; }

    /* 수식: 좁은 화면에서 긴 수식이 잘리지 않고 가로 스크롤 되도록 */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.35rem 0; margin: 1rem 0 !important; }
    .katex-display > .katex { font-size: 1.5em; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#111315] text-slate-800 dark:text-slate-200 antialiased min-h-screen flex flex-col relative transition-colors duration-200">

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-start py-8">
    
    <!-- 🏠 메인 로비 -->
    <div id="view-lobby" class="w-full flex flex-col space-y-4">
      <div class="bg-white dark:bg-[#1a1d20] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8 text-center mb-4 transition-colors">

    <!-- ⚙️ 공통 설정 화면 -->

      </div>

    <!-- 📝 객관식 풀이 영역 -->
    <div id="view-quiz" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit outline-none">⬅️ 종료</button>
      <div class="bg-white dark:bg-[#1a1d20] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
        <div class="flex justify-between items-center mb-4">
          <div><span id="qBadge" class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded mr-2">과목</span><span id="qProgress" class="text-xs text-slate-400 font-medium">1/10</span></div>
          <button onclick="toggleStar()" id="starBtn" class="text-3xl outline-none">☆</button>
        </div>

        <div id="qOptions" class="space-y-3"></div>
        <div id="qExpBox" class="mt-6 p-5 bg-slate-50 dark:bg-[#111315] border border-slate-200 dark:border-slate-700 rounded-xl hidden">

          <div class="flex gap-2">

      <div class="grid grid-cols-2 gap-2 mb-4">

      </div>
    </div>
    
  </main>

  <script>
    function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); document.getElementById('themeToggleBtn').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; }
    window.addEventListener('DOMContentLoaded', () => { document.getElementById('themeToggleBtn').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; });
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }

    // 수식 렌더링
    function applyMathRendering() { setTimeout(() => { renderMathInElement(document.body, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false} ], throwOnError: false }); }, 50); }

    const SUPABASE_URL = "https://hyqsrajudsymexxuekfb.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cXNyYWp1ZHN5bWV4eHVla2ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzA0MDEsImV4cCI6MjEwOTcwNjQwMX0.6OPx9ClxjCnIfGcCFwYhgbWICcpgBI1cvx1QcAyVvIY"; 
    let supabaseClient; try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

    let allQuizData = []; let allInterviewData = []; let allTheories = []; let filteredSession = [];   
    let currentIndex = 0; let correctCount = 0; let currentMode = 'quiz'; let currentKeyword = null;
    let starredIds = JSON.parse(localStorage.getItem('semiCbtStarred')) || [];
    // 📒 오답 노트: 틀린 문제는 자동 저장 { 문제ID: {wrong, right, last, memo} } — ★ 즐겨찾기(starredIds)와 별개
    let wrongNotes = {}; try { wrongNotes = JSON.parse(localStorage.getItem('semiCbtWrong')) || {}; } catch (e) { wrongNotes = {}; }

    const escH = (v) => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    
    const FIXED_CATEGORIES = ["반도체 기초 이론", "반도체 8대 공정", "차세대 첨단 기술", "기타"];
    // 📁 백과사전 폴더 구조 (문서가 없어도 항상 보임 / 새 이론은 category·subject 가 일치하는 폴더에 들어감)
    const CATEGORY_TREE = {
      "반도체 기초 이론": ["반도체 물리", "트랜지스터 소자", "메모리 반도체"],

      "차세대 첨단 기술": ["차세대 소자 기술", "어드밴스드 패키징"]
    };
    const FIXED_SUBJECTS = Object.values(CATEGORY_TREE).flat().concat(["일반"]);
    
    let currentViewId = 'view-lobby'; let learnState = { level: 'home', category: '', subject: '', theoryId: '' };

    async function initApp() {
      try {
        const ts = new Date().getTime();
        const [qRes, iRes, tRes] = await Promise.all([fetch(`./data/questions.json?t=${ts}`).catch(()=>null), fetch(`./data/interviews.json?t=${ts}`).catch(()=>null), fetch(`./data/theories.json?t=${ts}`).catch(()=>null)]);
        if(qRes && qRes.ok) allQuizData = await qRes.json(); if(iRes && iRes.ok) allInterviewData = await iRes.json();
        if(tRes && tRes.ok) {
          const raw = await tRes.json();
          allTheories = raw.filter(t => !String(t.content || '').includes('채워질 예정')).map((t, idx) => ({ ...t, id: t.id || "T-" + idx, category: t.category || "기타", subject: t.subject || "일반" }));
        }
        applyState('view-lobby', learnState);
      } catch (e) {}
    }

    function navTo(viewId, newLearnState = null) {
      if (newLearnState) learnState = { ...learnState, ...newLearnState }; applyState(viewId, learnState);
    }
    function goBack() {
      if (currentViewId === 'view-learning' && document.getElementById('theorySearchInput').value.trim() !== '') {
        document.getElementById('theorySearchInput').value = ''; applyState('view-learning', learnState);
      } else { navTo('view-lobby'); }
    }
    function applyState(viewId, state) {
      ['view-lobby', 'view-setup', 'view-quiz', 'view-interview', 'view-learning', 'view-note', 'view-result'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden'); currentViewId = viewId;
      if (viewId === 'view-learning') {
        document.getElementById('theorySearchInput').value = '';
        if (state.level === 'home') renderHomeDOM(); else if (state.level === 'category') renderSubjectsDOM(state.category); else if (state.level === 'subject') renderTitlesDOM(state.category, state.subject); else if (state.level === 'detail') renderDetailDOM(state.theoryId);
      } else if (viewId === 'view-note') renderNoteDOM();
      applyMathRendering();

    // 📖 백과사전 뷰 (max-w-2xl 사이즈에 맞춘 레이아웃)

    function renderTitleCard(t, container) {
      const btn = document.createElement('button');
      btn.className = "bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 hover:border-emerald-400 dark:hover:border-[#84cc9c] hover:shadow-md p-5 rounded-xl text-left transition flex items-center w-full shadow-sm";

        // 수식($...$, $$...$$)을 marked가 건드리지 못하게 잠시 빼 두었다가 되돌림
    function stashMath(md) {
      const stash = [];
      const hold = (m) => { stash.push(m); return `@@MATH${stash.length - 1}@@`; };
      const text = String(md || '').replace(/\$\$[\s\S]+?\$\$/g, hold).replace(/\$[^$\n]+?\$/g, hold);
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return { text, restore: (html) => html.replace(/@@MATH(\d+)@@/g, (_, i) => esc(stash[Number(i)])) };
    }
    
    function renderDetailDOM(theoryId) {
      const t = allTheories.find(x => x.id === theoryId);
      const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-4"; container.innerHTML = '';
      const card = document.createElement('div'); card.className = "bg-white dark:bg-[#1a1d20] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden";
      const kwAttr = String(t.title).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const qN = Math.min(3, matchItems(allQuizData, t.title).length); const iN = Math.min(2, matchItems(allInterviewData, t.title).length);
      const math = stashMath(t.content); let rawMarkdown = math.text;
      // '**용어(영문)**는' 처럼 괄호 뒤에 한글이 바로 붙으면 marked가 굵게 처리를 못 해서 ** 가 그대로 보임 -> 직접 변환
      rawMarkdown = rawMarkdown.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
      rawMarkdown = rawMarkdown.replace(/>\s*💡\s*(.*?)(?=\n\n|\n###|$)/gs, (match, p1) => `<div class="custom-highlight-box">${marked.parseInline(p1.trim())}</div>\n\n`);
      rawMarkdown = rawMarkdown.replace(/###\s*\[(.*?)\]\s*(.*)/g, (match, badgeText, titleText) => `<div class="custom-badge-heading"><span class="custom-badge">${badgeText}</span>${titleText}</div>`);
      
      card.innerHTML = `
        <div class="p-6 md:p-8">
          <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-4 leading-tight">${t.title}</h2>
          <div class="custom-table-container prose prose-slate dark:prose-invert max-w-none text-sm md:text-base leading-relaxed dark:text-slate-300">
            ${math.restore(marked.parse(rawMarkdown))}
          </div>
        </div>
        <div class="bg-slate-50 dark:bg-[#1a231c] p-6 border-t border-slate-200 dark:border-[#2d4a36]">
          <p class="text-xs font-bold text-slate-400 dark:text-slate-500 mb-3">📌 배운 내용 점검하기</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button onclick="startMiniQuiz('${kwAttr}')" ${qN ? '' : 'disabled'} class="w-full bg-indigo-600 dark:bg-[#84cc9c] hover:bg-indigo-700 dark:hover:bg-[#6ab382] text-white dark:text-[#111315] font-black text-sm py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
              <span class="text-lg">🧩</span> 실전 문제 풀기 <span class="text-xs font-bold opacity-80">${qN ? qN + '문항' : '준비 중'}</span>
            </button>
            <button onclick="startMiniInterview('${kwAttr}')" ${iN ? '' : 'disabled'} class="w-full bg-white dark:bg-[#111315] border-2 border-indigo-600 dark:border-[#84cc9c] text-indigo-700 dark:text-[#84cc9c] hover:bg-indigo-50 dark:hover:bg-[#1a231c] font-black text-sm py-4 rounded-xl transition flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed">
              <span class="text-lg">🗣️</span> 실전 면접 대비 <span class="text-xs font-bold opacity-80">${iN ? iN + '문항' : '준비 중'}</span>
            </button>

    // 이론과 관련된 문제/면접 문항 찾기
    //  1순위: theory_id 로 직접 연결된 문항 (새로 생성되는 문항은 모두 이쪽)
    //  2순위: 예전 문항 — 제목이 포함되거나, 제목이 영문 약어로 시작하면(DRAM, EDS …) 같은 대분류 안에서 약어가 단어로 등장하는 문항
    function matchItems(data, keyword) {
      const k = String(keyword || '').trim();
      if (!k) return [];
      const th = allTheories.find(t => t.title === k);
      const linked = th ? (data || []).filter(x => x.theory_id && x.theory_id === th.id) : [];
      if (linked.length) return linked;
      const low = k.toLowerCase();
      const head = k.split(/\s+/)[0];
      const acro = /^[A-Za-z][A-Za-z0-9\-\/.]*$/.test(head) && head.length >= 2 ? new RegExp('(^|[^a-z0-9])' + head.toLowerCase().replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '([^a-z0-9]|$)') : null;
      return (data || []).filter(x => {
        if (x.theory_id) return false; // 다른 이론에 연결된 문항은 제외
        if ([x.category, x.topic, x.question].some(v => String(v || '').toLowerCase().includes(low))) return true;
        const sameCat = !th || !x.category || x.category === th.category;
        return !!acro && sameCat && [x.topic, x.question].some(v => acro.test(String(v || '').toLowerCase()));
      });
    }
    function startMiniQuiz(keyword) {
      const list = matchItems(allQuizData, keyword);
      if (list.length === 0) return alert("현재 등록된 관련 문제가 없습니다.");
      currentKeyword = keyword;
      filteredSession = list.sort(() => Math.random() - 0.5).slice(0, 3);
      currentIndex = 0; correctCount = 0; sessionLog = []; currentMode = 'quiz'; navTo('view-quiz'); renderQuiz();
    }
    function startMiniInterview(keyword) {
      const list = matchItems(allInterviewData, keyword);
      if (list.length === 0) return alert("현재 등록된 관련 면접 문항이 없습니다.");
      currentKeyword = keyword;
      filteredSession = list.sort(() => Math.random() - 0.5).slice(0, 2);
      currentIndex = 0; correctCount = 0; currentMode = 'interview'; navTo('view-interview'); renderInterview();
    }
    // 결과 화면에서 '다른 유형으로 이어가기' (이론에서 시작했으면 같은 주제로, 아니면 설정 화면으로)
    function continueTo(mode) {
      if (currentKeyword) return mode === 'quiz' ? startMiniQuiz(currentKeyword) : startMiniInterview(currentKeyword);
      openSetup(mode);
    }
    function showResult(mode) {
      navTo('view-result');
      const total = filteredSession.length;
      const gauge = document.getElementById('resultGauge'), actions = document.getElementById('resultActions');
      const other = mode === 'quiz' ? 'interview' : 'quiz';
      const otherData = other === 'interview' ? allInterviewData : allQuizData;
      const otherReady = !currentKeyword || matchItems(otherData, currentKeyword).length > 0;
      const topicLine = currentKeyword ? `주제: ${currentKeyword}` : '';
      const set = (id, text) => { document.getElementById(id).textContent = text; };

      if (mode === 'quiz') {
        const pct = total ? Math.round(correctCount / total * 100) : 0;
        const color = pct >= 80 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#f43f5e';
        const R = 54, C = 2 * Math.PI * R;
        set('resultTitle', '문제 풀이 완료!');
        set('resultSub', (topicLine ? topicLine + ' · ' : '') + (pct >= 80 ? '훌륭해요! 🎉' : pct >= 50 ? '좋아요, 조금만 더! 💪' : '복습하고 다시 도전해 봐요 📖'));
        gauge.innerHTML = `<div class="relative w-44 h-44">
          <svg viewBox="0 0 128 128" class="w-full h-full -rotate-90">
            <circle cx="64" cy="64" r="${R}" fill="none" stroke="currentColor" stroke-width="10" class="text-slate-200 dark:text-slate-700"></circle>
            <circle id="gaugeArc" cx="64" cy="64" r="${R}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition: stroke-dashoffset 0.9s ease-out"></circle>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-xs font-bold text-slate-400 dark:text-slate-500">정답률</span>
            <span class="font-black text-slate-900 dark:text-white leading-none mt-1"><span class="text-4xl">${pct}</span><span class="text-base text-slate-400 dark:text-slate-500">/100%</span></span>
          </div>
        </div>`;
        requestAnimationFrame(() => requestAnimationFrame(() => { const a = document.getElementById('gaugeArc'); if (a && pct > 0) a.style.strokeDashoffset = C * (1 - pct / 100); }));
        set('scoreDetail', `${total}문제 중 ${correctCount}문제를 맞혔어요.`);
      } else {
        set('resultTitle', '면접 연습 완료!');
        set('resultSub', topicLine);
        gauge.innerHTML = `<div class="w-36 h-36 rounded-full bg-rose-50 dark:bg-rose-900/20 border-8 border-rose-200 dark:border-rose-800/40 flex items-center justify-center text-5xl">🗣️</div>`;
        set('scoreDetail', `${total}문항을 연습했어요. 소리 내어 답해 보면 더 좋아요.`);
      }

      if (mode === 'quiz') renderReview(); else document.getElementById('resultReview').classList.add('hidden');
      const wrongN = mode === 'quiz' ? sessionLog.filter(r => r && !r.ok).length : 0;
      const retryBtn = wrongN ? `<button onclick="retryWrong()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-black py-3.5 rounded-xl shadow-md transition">🔁 틀린 ${wrongN}문제만 다시 풀기</button>` : '';
      const nextLabel = other === 'interview' ? '🗣️ 실무 면접 대비로 이어가기' : '📝 실전 문제로 이어가기';
      actions.innerHTML = retryBtn + `
        <button onclick="continueTo('${other}')" ${otherReady ? '' : 'disabled'} class="w-full bg-indigo-600 dark:bg-[#84cc9c] hover:bg-indigo-700 dark:hover:bg-[#6ab382] text-white dark:text-[#111315] font-black py-3.5 rounded-xl shadow-md transition disabled:opacity-40 disabled:cursor-not-allowed">${nextLabel}${otherReady ? '' : ' (준비 중)'}</button>
        <button onclick="navTo('view-lobby')" class="w-full bg-white dark:bg-[#111315] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 font-bold py-3.5 rounded-xl transition">🏠 홈으로</button>`;
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumbContainer'); bc.classList.remove('hidden');
      bc.innerHTML = `<button onclick="navTo('view-learning', {level:'home'})" class="text-emerald-700 dark:text-[#84cc9c] font-bold px-2 hover:underline">📚 백과사전</button>`;
      if (learnState.level !== 'home') bc.innerHTML += `<span class="text-emerald-200 dark:text-[#2d4a36]">❯</span><button onclick="navTo('view-learning', {level:'category', category: '${learnState.category}'})" class="text-slate-600 dark:text-white font-bold px-2 hover:underline">${learnState.category}</button>`;
      if (learnState.level === 'subject' || learnState.level === 'detail') bc.innerHTML += `<span class="text-emerald-200 dark:text-[#2d4a36]">❯</span><button onclick="navTo('view-learning', {level:'subject', category: '${learnState.category}', subject: '${learnState.subject}'})" class="text-slate-600 dark:text-white font-bold px-2 hover:underline">${learnState.subject}</button>`;
    }

    function handleTheorySearch() {
      const query = document.getElementById('theorySearchInput').value.trim().toLowerCase();
      if (!query) return applyState('view-learning', learnState);
      document.getElementById('breadcrumbContainer').classList.add('hidden');
      const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-3"; container.innerHTML = '';
      const res = allTheories.filter(t => t.title.toLowerCase().includes(query) || t.content.toLowerCase().includes(query));
      if (res.length === 0) container.innerHTML = `<div class="bg-white dark:bg-[#1a1d20] p-6 text-center text-slate-400 rounded-xl">검색 결과가 없습니다.</div>`;
      else res.forEach(t => renderTitleCard(t, container));
    }

    // 문항 수 선택지: 문제 5/10/20, 면접 3/5/10 (보유 문항이 적으면 있는 만큼만 출제)
    const COUNT_OPTIONS = { quiz: [5, 10, 20], interview: [3, 5, 10] };
    const COUNT_DEFAULT = { quiz: 10, interview: 5 };
    function openSetup(mode) {
      currentMode = mode;
      document.getElementById('setupTitle').innerText = mode === 'quiz' ? "📝 객관식 설정" : "🗣️ 면접 설정";
      const sel = document.getElementById('select-count');
      sel.innerHTML = COUNT_OPTIONS[mode].map(n => `<option value="${n}" ${n === COUNT_DEFAULT[mode] ? 'selected' : ''}>${n}개</option>`).join('');
      updateSetupHint();
      navTo('view-setup');
    }
    function setupPool() {
      const sub = document.getElementById('select-subject').value;
      const data = currentMode === 'quiz' ? allQuizData : allInterviewData;
      return data.filter(q => sub === "ALL" || (q.category && q.category.includes(sub)));
    }
    function updateSetupHint() {
      const n = setupPool().length, want = parseInt(document.getElementById('select-count').value || '0');
      const unit = currentMode === 'quiz' ? '문제' : '면접 문항';
      document.getElementById('setupHint').textContent = n === 0 ? `선택한 과목에 등록된 ${unit}가 아직 없어요.` : (n < want ? `현재 ${unit} ${n}개가 있어서 ${n}개를 모두 출제해요.` : `현재 ${unit} ${n}개 중에서 무작위로 출제해요.`);
    }
    function startSession() {
      const cnt = parseInt(document.getElementById('select-count').value) || COUNT_DEFAULT[currentMode];
      filteredSession = setupPool();
      if (filteredSession.length === 0) return alert("선택한 과목에 등록된 문항이 없습니다.");
      filteredSession = filteredSession.sort(() => Math.random() - 0.5).slice(0, cnt);
      currentKeyword = null; currentIndex = 0; correctCount = 0; sessionLog = []; navTo(currentMode === 'quiz' ? 'view-quiz' : 'view-interview');
      if (currentMode === 'quiz') renderQuiz(); else renderInterview();
    }
    
    function renderQuiz() {
      const q = filteredSession[currentIndex];
      document.getElementById('qBadge').innerText = `${q.category} (${q.difficulty})`; document.getElementById('qProgress').innerText = `${currentIndex + 1} / ${filteredSession.length}`; document.getElementById('qTitle').innerText = q.question;
      const star = document.getElementById('starBtn'); star.innerText = starredIds.includes(q.id) ? "★" : "☆"; star.className = starredIds.includes(q.id) ? "text-3xl text-amber-400" : "text-3xl text-slate-300 dark:text-slate-600";
      const opts = document.getElementById('qOptions'); opts.innerHTML = ''; document.getElementById('qExpBox').classList.add('hidden');
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button'); 
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#1a1d20] hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 text-sm flex items-center transition";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 flex items-center justify-center text-xs mr-3 font-bold">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => checkAnswer(idx, q); opts.appendChild(btn);
      });
      applyMathRendering();
    }
    function checkAnswer(idx, q) {
      Array.from(document.getElementById('qOptions').children).forEach(b => b.disabled = true); document.getElementById('qExpBox').classList.remove('hidden');
      const st = document.getElementById('qStatus');
      const ok = idx === q.answer; sessionLog[currentIndex] = { q, picked: idx, ok };
      const n = wrongNotes[q.id] || (ok ? null : { wrong: 0, right: 0, memo: '' });
      if (n) { if (ok) n.right = (n.right || 0) + 1; else n.wrong = (n.wrong || 0) + 1; n.last = Date.now(); wrongNotes[q.id] = n; saveWrong(); }
      if (ok) { correctCount++; st.className = "font-bold text-emerald-600 dark:text-[#84cc9c] mb-1"; st.innerText = "⭕ 정답!"; } else { st.className = "font-bold text-rose-500 dark:text-rose-400 mb-1"; st.innerText = `❌ 오답 (정답: ${q.answer + 1}번)`; }
      document.getElementById('qExpText').innerText = q.explanation;
      const nxt = document.getElementById('qNextBtn');
      if (currentIndex === filteredSession.length - 1) { nxt.innerText = "종료"; nxt.onclick = () => showResult('quiz'); } else { nxt.innerText = "다음"; nxt.onclick = () => { currentIndex++; renderQuiz(); }; }
      applyMathRendering();
    }
    function renderInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iBadge').innerText = i.category; document.getElementById('iProgress').innerText = `${currentIndex+1}/${filteredSession.length}`; document.getElementById('iTitle').innerText = i.question;
      document.getElementById('iRevealBtn').classList.remove('hidden'); document.getElementById('iExpBox').classList.add('hidden');
      applyMathRendering();
    }
    function revealInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iRevealBtn').classList.add('hidden'); document.getElementById('iExpBox').classList.remove('hidden');
      document.getElementById('iKeywords').innerHTML = (i.key_points||[]).map(k=>`<span class="bg-rose-100 dark:bg-rose-900/30 text-rose-700 dark:text-rose-400 px-2 py-1 rounded text-xs font-bold">#${k}</span>`).join('');
      document.getElementById('iAnsText').innerText = i.interview_answer;
      const nxt = document.getElementById('iNextBtn');
      if(currentIndex === filteredSession.length-1) { nxt.innerText = "종료"; nxt.onclick = () => showResult('interview'); } else { nxt.innerText = "다음"; nxt.onclick = ()=>{currentIndex++; renderInterview();} }
      applyMathRendering();
    }
    function setNoteTab(t) { noteTab = t; renderNoteDOM(); }
    function noteItems() {
      if (noteTab === 'star') return allQuizData.filter(q => starredIds.includes(q.id));
      return allQuizData.filter(q => wrongNotes[q.id]).sort((a, b) => (wrongNotes[b.id].last || 0) - (wrongNotes[a.id].last || 0));
    }
    function renderNoteDOM() {
      const on = 'bg-indigo-600 dark:bg-[#84cc9c] text-white dark:text-[#111315] border-transparent', off = 'bg-white dark:bg-[#1a1d20] text-slate-500 dark:text-slate-300 border-slate-200 dark:border-slate-700';
      const wc = allQuizData.filter(q => wrongNotes[q.id]).length, sc = allQuizData.filter(q => starredIds.includes(q.id)).length;
      const tw = document.getElementById('noteTabWrong'), ts = document.getElementById('noteTabStar');
      tw.textContent = `❌ 틀린 문제 ${wc}`; ts.textContent = `★ 즐겨찾기 ${sc}`;
      tw.className = 'py-2.5 rounded-xl text-sm font-bold border transition ' + (noteTab === 'wrong' ? on : off);
      ts.className = 'py-2.5 rounded-xl text-sm font-bold border transition ' + (noteTab === 'star' ? on : off);
      const items = noteItems();
      const pb = document.getElementById('notePracticeBtn');
      pb.classList.toggle('hidden', items.length === 0);
      pb.textContent = (noteTab === 'wrong' ? '🔁 틀린 문제 다시 풀기' : '🔁 즐겨찾기 문제 풀기') + ` (${Math.min(items.length, 20)}문항)`;
      const c = document.getElementById('noteContainer'); c.innerHTML = '';
      if (items.length === 0) {
        c.innerHTML = `<div class="bg-white dark:bg-[#1a1d20] p-6 rounded-2xl text-center text-slate-400 border border-slate-200 dark:border-slate-800">${noteTab === 'wrong' ? '틀린 문제가 아직 없어요. 문제를 풀면 오답이 자동으로 쌓여요.' : '즐겨찾기한 문제가 없어요. 문제 풀이 중 ☆를 눌러 보세요.'}</div>`;
        return;
      }
      items.forEach(q => {
        const n = wrongNotes[q.id] || {};
        const stat = noteTab === 'wrong' ? `<span class="text-xs text-slate-400 dark:text-slate-500">틀림 ${n.wrong || 0} · 맞힘 ${n.right || 0}</span>` : '';
        const d = document.createElement('div'); d.className = 'bg-white dark:bg-[#1a1d20] rounded-2xl p-5 border border-slate-200 dark:border-slate-800';
        d.innerHTML = `<div class="flex justify-between items-center mb-3 gap-2"><div class="flex items-center gap-2 min-w-0"><span class="bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 text-xs px-2 py-1 rounded font-bold shrink-0">${escH(q.category)}</span>${stat}</div><button data-del="${escH(q.id)}" class="text-xs text-rose-500 dark:text-rose-400 font-bold shrink-0">${noteTab === 'wrong' ? '노트에서 삭제' : '즐겨찾기 해제'}</button></div>
          <h3 class="mb-4 font-bold dark:text-white">${q.question}</h3>
          <button data-toggle="ans-${escH(q.id)}" class="w-full bg-slate-100 dark:bg-[#111315] hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 py-2 rounded-lg text-sm font-bold">해설 보기 ↕</button>
          <div id="ans-${escH(q.id)}" class="hidden bg-slate-50 dark:bg-[#111315] p-4 rounded-lg mt-3 border border-slate-100 dark:border-slate-800"><span class="text-emerald-600 dark:text-[#84cc9c] mb-2 block font-bold">정답: ${q.answer + 1}번 · ${q.options[q.answer]}</span><p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">${q.explanation}</p></div>
          ${noteTab === 'wrong' ? `<textarea data-memo="${escH(q.id)}" rows="2" maxlength="300" placeholder="✏️ 나만의 메모 (헷갈린 이유, 외울 포인트…)" class="w-full mt-3 bg-slate-50 dark:bg-[#111315] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg p-3 text-sm outline-none focus:border-amber-400">${escH(n.memo || '')}</textarea>` : ''}`;
        c.appendChild(d);
      });
      applyMathRendering();
    }
    // 노트 화면 이벤트(삭제 / 해설 토글 / 메모 저장)는 한 곳에서 처리
    document.getElementById('noteContainer').addEventListener('click', (e) => {
      const del = e.target.closest('[data-del]'), tg = e.target.closest('[data-toggle]');
      if (del) { removeNote(del.dataset.del); } else if (tg) { document.getElementById(tg.dataset.toggle).classList.toggle('hidden'); }
    });
    document.getElementById('noteContainer').addEventListener('input', (e) => {
      const id = e.target.dataset && e.target.dataset.memo; if (!id || !wrongNotes[id]) return;
      wrongNotes[id].memo = e.target.value; saveWrong();
    });
    function removeNote(id) {
      if (noteTab === 'wrong') { delete wrongNotes[id]; saveWrong(); }
      else { starredIds = starredIds.filter(x => x !== id); localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds)); }
      renderNoteDOM();
    }
    function practiceNotes() {
      const items = noteItems(); if (!items.length) return;
      filteredSession = items.slice().sort(() => Math.random() - 0.5).slice(0, 20);
      currentKeyword = null; currentIndex = 0; correctCount = 0; sessionLog = []; currentMode = 'quiz'; navTo('view-quiz'); renderQuiz();
    }
    // 방금 푼 세션에서 틀린 문제만 다시 풀기
    function retryWrong() {
      const wrong = sessionLog.filter(r => r && !r.ok).map(r => r.q); if (!wrong.length) return;
      filteredSession = wrong.sort(() => Math.random() - 0.5);
      currentIndex = 0; correctCount = 0; sessionLog = []; currentMode = 'quiz'; navTo('view-quiz'); renderQuiz();
    }
    function renderReview() {
      const box = document.getElementById('resultReview'), list = document.getElementById('reviewList');
      const rows = sessionLog.filter(Boolean);
      if (!rows.length) { box.classList.add('hidden'); return; }
      box.classList.remove('hidden'); list.innerHTML = '';
      rows.forEach((r, i) => {
        const q = r.q, d = document.createElement('div');
        d.className = 'rounded-xl border ' + (r.ok ? 'border-emerald-200 dark:border-[#2d4a36]' : 'border-rose-200 dark:border-rose-900/50');
        d.innerHTML = `<button data-rv="${i}" class="w-full flex items-center gap-3 p-3 text-left">
            <span class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center text-sm font-black ${r.ok ? 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-[#84cc9c]' : 'bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400'}">${r.ok ? 'O' : 'X'}</span>
            <span class="flex-1 min-w-0 text-sm font-semibold text-slate-700 dark:text-slate-200 truncate">${i + 1}. ${escH(q.question)}</span>
            <span class="text-slate-300 dark:text-slate-600">⌄</span></button>
          <div id="rv-${i}" class="hidden px-4 pb-4 text-sm">
            <p class="font-bold text-slate-900 dark:text-white mb-3">${q.question}</p>
            <p class="mb-1 ${r.ok ? 'text-emerald-600 dark:text-[#84cc9c]' : 'text-rose-500 dark:text-rose-400'}">내 답: ${r.picked + 1}번 · ${q.options[r.picked]}</p>
            ${r.ok ? '' : `<p class="mb-2 text-emerald-600 dark:text-[#84cc9c] font-bold">정답: ${q.answer + 1}번 · ${q.options[q.answer]}</p>`}
            <p class="text-slate-600 dark:text-slate-400 leading-relaxed bg-slate-50 dark:bg-[#111315] rounded-lg p-3">${q.explanation}</p></div>`;
        list.appendChild(d);
      });
      applyMathRendering();
    }
    document.getElementById('reviewList').addEventListener('click', (e) => {
      const b = e.target.closest('[data-rv]'); if (b) document.getElementById('rv-' + b.dataset.rv).classList.toggle('hidden');
    });
    function toggleStar() {
      const id = filteredSession[currentIndex].id; const s = document.getElementById('starBtn');
      if(starredIds.includes(id)) { starredIds = starredIds.filter(x=>x!==id); s.innerText="☆"; s.className="text-3xl text-slate-300 dark:text-slate-600"; } else { starredIds.push(id); s.innerText="★"; s.className="text-3xl text-amber-400"; }
      localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds));
    }
    // ===== 🚨 오류 제보 =====
    let reportTarget = null;
    function setReportMsg(text, kind) {
      const el = document.getElementById('reportMsg');
      el.textContent = text;
      el.className = 'text-xs mt-2 min-h-[1rem] ' + (kind === 'err' ? 'text-rose-500' : kind === 'ok' ? 'text-emerald-500' : 'text-slate-400');
    }
    function openReportModal() {
      const item = filteredSession[currentIndex];
      if (!item) return;
      reportTarget = { id: String(item.id || ''), text: String(item.question || '').slice(0, 120) };
      const short = reportTarget.text.length > 40 ? reportTarget.text.slice(0, 40) + '…' : reportTarget.text;
      document.getElementById('reportTarget').textContent = `대상: ${reportTarget.id} · ${short}`;
      document.getElementById('reportContent').value = '';
      document.getElementById('reportSubmitBtn').disabled = false;
      setReportMsg('', '');
      const m = document.getElementById('reportModal'); m.classList.remove('hidden'); m.classList.add('flex');
      setTimeout(() => document.getElementById('reportContent').focus(), 50);
    }
    function closeReportModal() {
      const m = document.getElementById('reportModal'); m.classList.remove('flex'); m.classList.add('hidden');
    }
    async function submitReport() {
      if (!reportTarget) return;
      const content = document.getElementById('reportContent').value.trim();
      if (content.length < 5) return setReportMsg('5자 이상 적어 주세요.', 'err');
      let last = 0; try { last = Number(localStorage.getItem('semiCbtLastReport') || 0); } catch (e) {}
      if (Date.now() - last < 15000) return setReportMsg('잠시 후 다시 제보해 주세요.', 'err');
      if (!supabaseClient) return setReportMsg('서버 연결에 실패했습니다. 새로고침 후 다시 시도해 주세요.', 'err');

      const btn = document.getElementById('reportSubmitBtn');
      btn.disabled = true; setReportMsg('전송 중...', 'info');
      const { error } = await supabaseClient.from('error_reports').insert({
        question_id: reportTarget.id,
        question_text: reportTarget.text,
        content: content,
        status: 'pending'
      });
      if (error) {
        console.error('제보 실패:', error);
        btn.disabled = false;
        return setReportMsg('전송 실패: ' + (error.message || '알 수 없는 오류'), 'err');
      }
      try { localStorage.setItem('semiCbtLastReport', String(Date.now())); } catch (e) {}
      setReportMsg('✅ 제보가 접수되었습니다. 감사합니다!', 'ok');
      setTimeout(closeReportModal, 1200);
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeReportModal(); });
    initApp();
  </script>
</body>
</html>
