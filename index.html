<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 반도체 직무 전공 AI 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col relative">

  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center relative z-10">
    <h1 class="text-xl font-bold tracking-tight cursor-pointer" onclick="navTo('view-lobby')">⚡ SemiCBT</h1>
    <button class="bg-indigo-700 hover:bg-indigo-600 text-xs px-3 py-1.5 rounded-lg transition" onclick="navTo('view-lobby')">🏠 홈으로</button>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center py-8">
    
    <!-- 🏠 메인 로비 (4분할 구조) -->
    <div id="view-lobby" class="w-full flex flex-col space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center mb-4">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">반도체 취업 마스터</h2>
        <p class="text-slate-500 text-sm">원하는 학습 모드를 선택하세요.</p>
      </div>
      
      <div class="grid grid-cols-2 gap-4">
        <button onclick="navTo('view-learning', {level: 'home'})" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">📖</span><span class="font-bold text-sm">이론 백과사전</span>
        </button>
        <button onclick="navTo('view-note')" class="bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">⭐</span><span class="font-bold text-sm">오답 노트</span>
        </button>
      </div>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <!-- 📝 객관식 진입 버튼 -->
        <button onclick="openSetup('quiz')" class="bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">📝</span><span class="font-bold text-lg">객관식 전공 시험</span>
        </button>
        <!-- 🗣️ 면접 대비 진입 버튼 -->
        <button onclick="openSetup('interview')" class="bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">🗣️</span><span class="font-bold text-lg">실무 면접 대비</span>
        </button>
      </div>
    </div>

    <!-- ⚙️ 공통 설정 화면 -->
    <div id="view-setup" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-600 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 뒤로</button>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 id="setupTitle" class="text-xl font-bold text-slate-800 mb-6">설정</h2>
        <div class="mb-4">
          <label class="block text-sm font-semibold text-slate-700 mb-2">과목 선택</label>
          <select id="select-subject" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
            <option value="ALL">✨ 전체 과목 통합</option>
            <option value="반도체 기초 이론">반도체 기초 이론</option>
            <option value="반도체 8대 공정">반도체 8대 공정</option>
            <option value="차세대 첨단 기술">차세대 첨단 기술</option>
          </select>
        </div>
        <div class="mb-8">
          <label class="block text-sm font-semibold text-slate-700 mb-2">문항 수 선택</label>
          <select id="select-count" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
            <option value="ALL">최대 (모두 풀기)</option>
            <option value="5">5개</option>
            <option value="10">10개</option>
          </select>
        </div>
        <button onclick="startSession()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 rounded-xl transition shadow-md">시작하기</button>
      </div>
    </div>

    <!-- 📝 객관식 풀이 영역 -->
    <div id="view-quiz" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 종료</button>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex justify-between items-center mb-4">
          <div><span id="qBadge" class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded mr-2">과목명</span><span id="qProgress" class="text-xs text-slate-400 font-medium">1 / 10</span></div>
        </div>
        <h2 id="qTitle" class="text-lg font-bold text-slate-900 mb-6">문제 지문</h2>
        <div id="qOptions" class="space-y-3"></div>
        
        <div id="qExpBox" class="mt-6 p-4 bg-slate-50 border border-slate-200 rounded-xl hidden">
          <div id="qStatus" class="font-bold text-sm mb-2"></div>
          <p id="qExpText" class="text-sm text-slate-600 leading-relaxed mb-4"></p>
          <div class="flex gap-2">
            <button onclick="openReportModal()" class="w-1/3 bg-rose-50 text-rose-600 border border-rose-200 py-2.5 rounded-lg text-sm font-semibold">🚨 오류 제보</button>
            <button id="qNextBtn" onclick="nextQuiz()" class="w-2/3 bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold">다음 문제</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 🗣️ 면접 대비 풀이 영역 -->
    <div id="view-interview" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 transition w-fit outline-none">⬅️ 종료</button>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <div class="flex justify-between items-center mb-4">
          <div><span id="iBadge" class="bg-rose-100 text-rose-700 text-xs font-semibold px-2.5 py-1 rounded mr-2">면접 시나리오</span><span id="iProgress" class="text-xs text-slate-400 font-medium">1 / 10</span></div>
        </div>
        <h2 id="iTitle" class="text-lg font-bold text-slate-900 mb-6 leading-snug">면접 질문 지문</h2>
        
        <button id="iRevealBtn" onclick="revealInterview()" class="w-full bg-slate-50 hover:bg-slate-100 border-2 border-dashed border-slate-300 text-slate-600 font-bold py-12 rounded-xl transition flex flex-col items-center justify-center">
          <span class="text-3xl mb-2">🤔</span><span>실제 면접처럼 소리내어 답변한 뒤 클릭하세요</span>
        </button>

        <div id="iExpBox" class="mt-6 p-4 bg-rose-50 border border-rose-200 rounded-xl hidden">
          <span class="text-xs font-bold text-rose-700 block mb-1">💡 반드시 포함되어야 할 핵심 키워드</span>
          <div id="iKeywords" class="flex flex-wrap gap-2 mb-4"></div>
          
          <div class="border-t border-rose-200 pt-4 mt-2">
            <span class="text-xs font-bold text-slate-800 block mb-2">🗣️ 모범 두괄식 스크립트</span>
            <p id="iAnsText" class="text-sm text-slate-800 font-medium leading-relaxed mb-4"></p>
          </div>
          
          <div class="flex gap-2 border-t border-rose-200 pt-4 mt-2">
            <button onclick="openReportModal()" class="w-1/3 bg-white text-rose-600 border border-rose-200 py-2.5 rounded-lg text-sm font-semibold">🚨 오류 제보</button>
            <button id="iNextBtn" onclick="nextInterview()" class="w-2/3 bg-slate-800 text-white py-2.5 rounded-lg text-sm font-semibold">다음 문항</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 오답 및 백과사전 뷰 (숨김 처리됨, 로직은 유지) -->
    <div id="view-learning" class="hidden"></div><div id="view-note" class="hidden"></div><div id="view-result" class="hidden"></div>
  </main>

  <!-- 오류 제보 팝업 -->
  <div id="reportModal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl relative transform transition-all">
      <h3 class="text-lg font-bold text-slate-900 mb-2">🚨 문제/면접 오류 제보</h3>
      <p class="text-xs text-slate-500 mb-4">제보 내용은 DB를 통해 관리자에게 즉시 전달됩니다.</p>
      <textarea id="reportContent" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm h-32 outline-none focus:border-rose-500 mb-4 resize-none" placeholder="오류 내용을 상세히 적어주세요."></textarea>
      <div class="flex gap-2">
        <button onclick="closeReportModal()" class="w-1/2 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl">취소</button>
        <button id="submitReportBtn" onclick="submitReport()" class="w-1/2 bg-rose-600 text-white font-bold py-3 rounded-xl">제출하기</button>
      </div>
    </div>
  </div>

  <script>
    // 🔴 적용된 Supabase 프로젝트 정보
    const SUPABASE_URL = "https://hyqsrajudsymexxuekfb.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cXNyYWp1ZHN5bWV4eHVla2ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzA0MDEsImV4cCI6MjEwOTcwNjQwMX0.6OPx9ClxjCnIfGcCFwYhgbWICcpgBI1cvx1QcAyVvIY"; 
    
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allQuizData = [];    
    let allInterviewData = []; 
    let filteredSession = [];   
    let currentIndex = 0;    
    let correctCount = 0;
    let currentMode = 'quiz'; // 'quiz' or 'interview'

    async function initApp() {
      try {
        const timestamp = new Date().getTime();
        let qUrl = `./data/questions.json?t=${timestamp}`;
        let iUrl = `./data/interviews.json?t=${timestamp}`;

        // 객관식 로드
        try { const qRes = await fetch(qUrl); allQuizData = await qRes.json(); } catch(e) { allQuizData = []; }
        
        // 면접 데이터 로드 (파일이 없어도 에러 안 나게 처리)
        try { 
          const iRes = await fetch(iUrl);
          allInterviewData = iRes.ok ? await iRes.json() : [];
        } catch(e) { allInterviewData = []; }

        applyState('view-lobby');
      } catch (e) { console.error("초기화 실패:", e); }
    }

    function navTo(viewId) { applyState(viewId); }
    function goBack() { applyState('view-lobby'); }
    function applyState(viewId) {
      ['view-lobby', 'view-setup', 'view-quiz', 'view-interview'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
    }

    // --- 설정 화면 연동 ---
    function openSetup(mode) {
      currentMode = mode;
      document.getElementById('setupTitle').innerText = mode === 'quiz' ? "📝 객관식 시험 설정" : "🗣️ 면접 대비 설정";
      navTo('view-setup');
    }

    function startSession() {
      const subject = document.getElementById('select-subject').value;
      const count = document.getElementById('select-count').value;
      const dataSource = currentMode === 'quiz' ? allQuizData : allInterviewData;

      filteredSession = dataSource.filter(q => subject === "ALL" || (q.category && q.category.includes(subject)));
      if (filteredSession.length === 0) return alert("해당 조건의 문항이 없습니다.");
      
      filteredSession = filteredSession.sort(() => Math.random() - 0.5);
      if (count !== "ALL") filteredSession = filteredSession.slice(0, parseInt(count));
      
      currentIndex = 0; correctCount = 0;
      navTo(currentMode === 'quiz' ? 'view-quiz' : 'view-interview');
      if (currentMode === 'quiz') renderQuiz(); else renderInterview();
    }

    // --- 객관식 진행 로직 ---
    function renderQuiz() {
      const q = filteredSession[currentIndex];
      document.getElementById('qBadge').innerText = `${q.category} (${q.difficulty})`;
      document.getElementById('qProgress').innerText = `${currentIndex + 1} / ${filteredSession.length}`;
      document.getElementById('qTitle').innerText = q.question;
      
      const optContainer = document.getElementById('qOptions'); optContainer.innerHTML = '';
      document.getElementById('qExpBox').classList.add('hidden');
      
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border hover:bg-indigo-50 font-medium text-sm flex items-center";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs mr-3 font-bold">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => checkAnswer(idx, q);
        optContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx, q) {
      Array.from(document.getElementById('qOptions').children).forEach(btn => btn.disabled = true);
      document.getElementById('qExpBox').classList.remove('hidden');
      const status = document.getElementById('qStatus');
      if (selectedIdx === q.answer) { correctCount++; status.className = "font-bold text-sm mb-1 text-emerald-600"; status.innerText = "⭕ 정답입니다!"; } 
      else { status.className = "font-bold text-sm mb-1 text-rose-600"; status.innerText = `❌ 오답 (정답: ${q.answer + 1}번)`; }
      document.getElementById('qExpText').innerText = q.explanation;
      
      const nextBtn = document.getElementById('qNextBtn');
      if (currentIndex === filteredSession.length - 1) { nextBtn.innerText = "종료하기"; nextBtn.onclick = () => goBack(); } 
      else { nextBtn.innerText = "다음 문제"; nextBtn.onclick = () => nextQuiz(); }
    }
    function nextQuiz() { currentIndex++; renderQuiz(); }

    // --- 면접 진행 로직 ---
    function renderInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iBadge').innerText = `${i.category}`;
      document.getElementById('iProgress').innerText = `${currentIndex + 1} / ${filteredSession.length}`;
      document.getElementById('iTitle').innerText = i.question;
      
      document.getElementById('iRevealBtn').classList.remove('hidden');
      document.getElementById('iExpBox').classList.add('hidden');
    }

    function revealInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iRevealBtn').classList.add('hidden');
      document.getElementById('iExpBox').classList.remove('hidden');
      
      const kwContainer = document.getElementById('iKeywords');
      kwContainer.innerHTML = (i.key_points || []).map(k => `<span class="bg-rose-100 text-rose-700 text-[11px] px-2 py-1 rounded font-bold">#${k}</span>`).join('');
      document.getElementById('iAnsText').innerText = i.interview_answer;
      
      const nextBtn = document.getElementById('iNextBtn');
      if (currentIndex === filteredSession.length - 1) { nextBtn.innerText = "종료하기"; nextBtn.onclick = () => goBack(); } 
      else { nextBtn.innerText = "다음 문항"; nextBtn.onclick = () => nextInterview(); }
    }
    function nextInterview() { currentIndex++; renderInterview(); }

    // --- 제보 기능 ---
    function openReportModal() { document.getElementById('reportModal').classList.replace('hidden', 'flex'); document.getElementById('reportContent').value = ''; }
    function closeReportModal() { document.getElementById('reportModal').classList.replace('flex', 'hidden'); }
    async function submitReport() {
      const content = document.getElementById('reportContent').value.trim();
      if(!content) return alert("오류 내용을 입력해주세요.");

      const item = filteredSession[currentIndex];
      document.getElementById('submitReportBtn').innerText = "전송 중...";
      try {
        await supabaseClient.from('error_reports').insert([{ question_id: item.id, content: content }]);
        alert("✅ 접수 완료!"); closeReportModal();
      } catch (e) { alert("전송 실패"); }
      document.getElementById('submitReportBtn').innerText = "제출하기";
    }

    initApp();
  </script>
</body>
</html>
