<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 반도체 직무 전공 AI 플랫폼</title>
  
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>tailwind.config = { darkMode: 'class', }</script>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 수식 렌더링 (KaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    /* ===== 라이트/다크 색상 토큰 (html.dark 일 때 아래 값으로 바뀜) ===== */
    :root {
      color-scheme: light;
      --hl-bg: #ecfdf5; --hl-border: #a7f3d0; --hl-accent: #10b981; --hl-text: #1f2937;
      --badge-bg: #d1fae5; --badge-fg: #047857;
      --heading: #0f172a;
      --tbl-bg: #ffffff; --tbl-border: #e2e8f0; --tbl-head-bg: #ecfdf5; --tbl-head-fg: #047857; --tbl-text: #334155;
    }
    html.dark {
      color-scheme: dark;
      --hl-bg: #1a231c; --hl-border: #2d4a36; --hl-accent: #84cc9c; --hl-text: #e2e8f0;
      --badge-bg: #2d4a36; --badge-fg: #84cc9c;
      --heading: #f8fafc;
      --tbl-bg: #1e293b; --tbl-border: #334155; --tbl-head-bg: #253328; --tbl-head-fg: #84cc9c; --tbl-text: #cbd5e1;
    }

    /* 하이라이트 박스 & 뱃지 커스텀 */
    .custom-highlight-box { background-color: var(--hl-bg); border: 1px solid var(--hl-border); border-left: 6px solid var(--hl-accent); border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 2rem; color: var(--hl-text); display: flex; gap: 12px; font-size: 0.95rem; line-height: 1.6;}
    .custom-highlight-box::before { content: '💡'; font-size: 1.25rem; }
    .custom-badge-heading { display: flex; align-items: center; gap: 10px; margin-top: 2.5rem; margin-bottom: 1.25rem; font-size: 1.15rem; font-weight: 800; color: var(--heading); }
    .custom-badge { background-color: var(--badge-bg); color: var(--badge-fg); font-size: 0.75rem; padding: 4px 10px; border-radius: 9999px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .custom-badge::before { content: ''; display: inline-block; width: 6px; height: 6px; background-color: var(--badge-fg); border-radius: 50%; }
    .custom-table-container table { width: 100%; border-collapse: separate; border-spacing: 0; border: 1px solid var(--tbl-border); border-radius: 12px; overflow: hidden; margin-top: 1rem; margin-bottom: 2rem; background-color: var(--tbl-bg); font-size: 0.9rem;}
    .custom-table-container th { background-color: var(--tbl-head-bg); color: var(--tbl-head-fg); text-align: left; padding: 0.75rem 1rem; font-weight: 700; border-bottom: 1px solid var(--tbl-border); }
    .custom-table-container td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--tbl-border); color: var(--tbl-text); }
    .custom-table-container tr:last-child td { border-bottom: 0; }

    /* 수식: 좁은 화면에서 긴 수식이 잘리지 않고 가로 스크롤 되도록 */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.35rem 0; margin: 1rem 0 !important; }
    .katex-display > .katex { font-size: 1.5em; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#111315] text-slate-800 dark:text-slate-200 antialiased min-h-screen flex flex-col relative transition-colors duration-200">

  <!-- 좌측 슬라이드 사이드바 -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity" onclick="toggleSidebar()"></div>
  <div id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full w-64 bg-white dark:bg-[#1a1d20] border-r border-slate-200 dark:border-slate-800 z-50 transition-transform duration-300 flex flex-col shadow-2xl">
    <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
      <span class="text-xl font-black text-indigo-700 dark:text-indigo-400">⚡ 메뉴</span>
      <button onclick="toggleSidebar()" class="text-3xl text-slate-400 hover:text-slate-600 dark:hover:text-white">&times;</button>
    </div>
    <div class="flex-1 p-4 space-y-2 mt-2">
      <button onclick="navTo('view-lobby'); toggleSidebar()" class="w-full text-left p-4 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 dark:text-slate-200 font-bold flex items-center gap-3"><span class="text-xl">🏠</span> 홈으로</button>
      <button onclick="navTo('view-learning', {level:'home'}); toggleSidebar()" class="w-full text-left p-4 rounded-xl hover:bg-emerald-50 dark:hover:bg-[#1a231c] text-emerald-800 dark:text-[#84cc9c] font-bold flex items-center gap-3"><span class="text-xl">📖</span> 이론 백과사전</button>
      <button onclick="navTo('view-note'); toggleSidebar()" class="w-full text-left p-4 rounded-xl hover:bg-amber-50 dark:hover:bg-amber-900/20 text-amber-700 dark:text-amber-400 font-bold flex items-center gap-3"><span class="text-xl">⭐</span> 오답 노트</button>
    </div>
  </div>

  <header class="bg-indigo-900 dark:bg-[#1a1d20] text-white p-4 shadow-md flex justify-between items-center relative z-10 border-b dark:border-slate-800">
    <div class="flex items-center gap-4">
      <button onclick="toggleSidebar()" class="text-2xl hover:text-indigo-300 transition outline-none">☰</button>
      <h1 class="text-xl font-bold tracking-tight cursor-pointer" onclick="navTo('view-lobby')">⚡ SemiCBT</h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" id="themeToggleBtn" class="text-lg bg-indigo-800 dark:bg-slate-800 hover:bg-indigo-700 w-8 h-8 rounded-full flex items-center justify-center transition shadow-inner">🌙</button>
    </div>
  </header>

  <!-- ✨ 다시 max-w-2xl 로 복귀하여 아늑한 사이즈 제공 -->
  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-start py-8">
    
    <!-- 🏠 메인 로비 -->
    <div id="view-lobby" class="w-full flex flex-col space-y-4">
      <div class="bg-white dark:bg-[#1a1d20] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8 text-center mb-4 transition-colors">
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">반도체 취업 마스터</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">원하는 학습 모드를 선택하세요.</p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="navTo('view-learning', {level: 'home'})" class="bg-emerald-50 dark:bg-[#1a231c] hover:bg-emerald-100 dark:hover:bg-[#253328] border border-emerald-200 dark:border-[#2d4a36] text-emerald-800 dark:text-[#84cc9c] p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-3">📖</span><span class="font-bold text-sm">이론 백과사전</span>
        </button>
        <button onclick="navTo('view-note')" class="bg-amber-50 dark:bg-amber-900/10 hover:bg-amber-100 border border-amber-200 dark:border-amber-800/30 text-amber-800 dark:text-amber-400 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-3">⭐</span><span class="font-bold text-sm">오답 노트</span>
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <button onclick="openSetup('quiz')" class="bg-indigo-50 dark:bg-indigo-900/10 hover:bg-indigo-100 border border-indigo-200 dark:border-indigo-800/30 text-indigo-800 dark:text-indigo-400 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">📝</span><span class="font-bold text-lg">객관식 시험</span>
        </button>
        <button onclick="openSetup('interview')" class="bg-rose-50 dark:bg-rose-900/10 hover:bg-rose-100 border border-rose-200 dark:border-rose-800/30 text-rose-800 dark:text-rose-400 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">🗣️</span><span class="font-bold text-lg">실무 면접 대비</span>
        </button>
      </div>
    </div>

    <!-- ⚙️ 공통 설정 화면 -->
    <div id="view-setup" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit">⬅️ 뒤로</button>
      <div class="bg-white dark:bg-[#1a1d20] rounded-2xl border border-slate-200 dark:border-slate-800 p-6">
        <h2 id="setupTitle" class="text-xl font-bold dark:text-white mb-6">설정</h2>
        <div class="mb-4">
          <select id="select-subject" class="w-full bg-slate-50 dark:bg-[#111315] border dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-lg p-3 outline-none"><option value="ALL">✨ 전체 과목 통합</option><option value="반도체 기초 이론">반도체 기초 이론</option><option value="반도체 8대 공정">반도체 8대 공정</option><option value="차세대 첨단 기술">차세대 첨단 기술</option></select>
        </div>
        <div class="mb-8">
          <select id="select-count" class="w-full bg-slate-50 dark:bg-[#111315] border dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-lg p-3 outline-none"><option value="ALL">최대 (모두 풀기)</option><option value="5">5개</option><option value="10">10개</option></select>
        </div>
        <button onclick="startSession()" class="w-full bg-slate-800 dark:bg-indigo-600 text-white font-bold py-3.5 rounded-xl">시작하기</button>
      </div>
    </div>

    <!-- 📝 객관식 풀이 영역 -->
    <div id="view-quiz" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit outline-none">⬅️ 종료</button>
      <div class="bg-white dark:bg-[#1a1d20] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-6">
        <div class="flex justify-between items-center mb-4">
          <div><span id="qBadge" class="bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 text-xs font-semibold px-2.5 py-1 rounded mr-2">과목</span><span id="qProgress" class="text-xs text-slate-400 font-medium">1/10</span></div>
          <button onclick="toggleStar()" id="starBtn" class="text-3xl outline-none">☆</button>
        </div>
        <h2 id="qTitle" class="text-lg font-bold dark:text-white mb-6">문제 지문</h2>
        <div id="qOptions" class="space-y-3"></div>
        <div id="qExpBox" class="mt-6 p-5 bg-slate-50 dark:bg-[#111315] border border-slate-200 dark:border-slate-700 rounded-xl hidden">
          <div id="qStatus" class="font-bold text-sm mb-2"></div>
          <p id="qExpText" class="text-sm dark:text-slate-300 mb-5 leading-relaxed"></p>
          <div class="flex gap-2">
            <button onclick="openReportModal()" class="w-1/3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-rose-600 dark:text-rose-400 py-2.5 rounded-lg text-sm font-semibold">🚨 제보</button>
            <button id="qNextBtn" onclick="nextQuiz()" class="w-2/3 bg-indigo-600 dark:bg-indigo-500 text-white py-2.5 rounded-lg text-sm font-semibold">다음</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 🗣️ 면접 대비 영역 -->
    <div id="view-interview" class="hidden w-full flex flex-col"><button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit outline-none">⬅️ 종료</button><div class="bg-white dark:bg-[#1a1d20] rounded-2xl border dark:border-slate-800 p-6"><div class="mb-4"><span id="iBadge" class="bg-rose-100 dark:bg-rose-900/30 text-rose-700 dark:text-rose-400 text-xs font-semibold px-2.5 py-1 rounded mr-2">면접</span><span id="iProgress" class="text-xs text-slate-400 font-medium">1/10</span></div><h2 id="iTitle" class="text-lg font-bold dark:text-white mb-6">지문</h2><button id="iRevealBtn" onclick="revealInterview()" class="w-full bg-slate-50 dark:bg-[#111315] text-slate-600 dark:text-slate-400 font-bold py-12 rounded-xl border-2 border-dashed dark:border-slate-700">🤔 답변 후 클릭</button><div id="iExpBox" class="mt-6 p-4 bg-rose-50 dark:bg-[#111315] rounded-xl hidden"><div id="iKeywords" class="flex flex-wrap gap-2 mb-4"></div><p id="iAnsText" class="text-sm dark:text-slate-300 mb-4"></p><div class="flex gap-2"><button onclick="openReportModal()" class="w-1/3 border dark:border-slate-700 text-rose-400 py-2.5 rounded-lg text-sm font-semibold">🚨 제보</button><button id="iNextBtn" onclick="nextInterview()" class="w-2/3 bg-slate-800 text-white py-2.5 rounded-lg text-sm font-semibold">다음</button></div></div></div></div>
    
    <!-- 🏆 결과 뷰 & 오답 노트 -->
    <div id="view-result" class="hidden w-full flex flex-col"><button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3">⬅️ 홈으로</button><div class="bg-white dark:bg-[#1a1d20] rounded-2xl border dark:border-slate-800 p-8 text-center"><h2 class="text-2xl font-bold dark:text-white mb-2">모의고사 완료!</h2><div class="flex justify-center my-6"><div class="w-32 h-32 rounded-full border-8 border-indigo-500 flex flex-col items-center justify-center"><span id="scoreText" class="text-3xl font-black text-indigo-600 dark:text-indigo-400">80</span></div></div><p id="scoreDetail" class="mb-6 dark:text-slate-300">결과</p><button onclick="navTo('view-lobby')" class="w-full bg-slate-800 dark:bg-indigo-600 text-white font-bold py-3.5 rounded-xl">로비로</button></div></div>
    <div id="view-note" class="hidden w-full flex flex-col"><button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3">⬅️ 뒤로</button><div class="bg-white dark:bg-[#1a1d20] rounded-2xl border dark:border-slate-800 p-6 mb-4 text-center"><h2 class="text-xl font-bold dark:text-white">⭐ 오답노트</h2></div><div id="noteContainer" class="space-y-4"></div></div>

    <!-- 📖 이론 백과사전 뷰 (작은 사이즈에 맞춘 배열로 복귀) -->
    <div id="view-learning" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 font-bold text-sm mb-4 transition w-fit outline-none">⬅️ 돌아가기</button>
      <div class="mb-6 relative">
        <input type="text" id="theorySearchInput" onkeyup="handleTheorySearch()" placeholder="🔍 키워드, 기술명 검색..." class="w-full bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-xl p-4 shadow-sm outline-none focus:border-[#84cc9c] transition font-medium">
      </div>
      <div id="breadcrumbContainer" class="bg-emerald-50 dark:bg-[#1a231c] rounded-xl border border-emerald-200 dark:border-[#2d4a36] px-4 py-3 mb-6 flex flex-wrap items-center shadow-sm gap-y-2 text-sm hidden"></div>
      <div id="learningContainer" class="grid grid-cols-1 gap-4"></div>
    </div>
    <!-- 🚨 오류 제보 모달 -->
    <div id="reportModal" class="hidden fixed inset-0 z-[60] items-center justify-center bg-black/60 p-4" onclick="if(event.target===this) closeReportModal()">
      <div class="w-full max-w-md bg-white dark:bg-[#1a1d20] rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl p-6">
        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-1">🚨 오류 제보</h3>
        <p id="reportTarget" class="text-xs text-slate-400 mb-4 break-words"></p>
        <textarea id="reportContent" rows="4" maxlength="500" placeholder="어떤 점이 잘못되었나요? (정답 오류, 오타, 해설 오류 등)" class="w-full bg-slate-50 dark:bg-[#111315] border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 rounded-lg p-3 text-sm outline-none focus:border-rose-400"></textarea>
        <p id="reportMsg" class="text-xs mt-2 min-h-[1rem]"></p>
        <div class="flex gap-2 mt-4">
          <button onclick="closeReportModal()" class="w-1/3 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 py-2.5 rounded-lg text-sm font-semibold">취소</button>
          <button id="reportSubmitBtn" onclick="submitReport()" class="w-2/3 bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-lg text-sm font-semibold disabled:opacity-50">제보하기</button>
        </div>
      </div>
    </div>
    
  </main>

  <script>
    function toggleTheme() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); document.getElementById('themeToggleBtn').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; }
    window.addEventListener('DOMContentLoaded', () => { document.getElementById('themeToggleBtn').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; });
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }

    // 수식 렌더링
    function applyMathRendering() { setTimeout(() => { renderMathInElement(document.body, { delimiters: [ {left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false} ], throwOnError: false }); }, 50); }

    const SUPABASE_URL = "https://hyqsrajudsymexxuekfb.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cXNyYWp1ZHN5bWV4eHVla2ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzA0MDEsImV4cCI6MjEwOTcwNjQwMX0.6OPx9ClxjCnIfGcCFwYhgbWICcpgBI1cvx1QcAyVvIY"; 
    let supabaseClient; try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

    let allQuizData = []; let allInterviewData = []; let allTheories = []; let filteredSession = [];   
    let currentIndex = 0; let correctCount = 0; let currentMode = 'quiz';
    let starredIds = JSON.parse(localStorage.getItem('semiCbtStarred')) || [];
    
    const FIXED_CATEGORIES = ["반도체 기초 이론", "반도체 8대 공정", "차세대 첨단 기술", "기타"];
    const FIXED_SUBJECTS = ["반도체 물리", "트랜지스터 소자", "메모리 반도체", "1. 웨이퍼 제조 공정", "2. 산화 공정 (Oxidation)", "3. 포토 공정 (Photo)", "4. 식각 공정 (Etching)", "5. 박막 증착 공정 (Deposition)", "6. 금속 배선 공정 (Metallization)", "7. EDS 공정 (Testing)", "8. 패키징 공정 (Packaging)", "차세대 소자 기술", "어드밴스드 패키징", "일반"];
    
    let currentViewId = 'view-lobby'; let learnState = { level: 'home', category: '', subject: '', theoryId: '' };

    async function initApp() {
      try {
        const ts = new Date().getTime();
        const [qRes, iRes, tRes] = await Promise.all([fetch(`./data/questions.json?t=${ts}`).catch(()=>null), fetch(`./data/interviews.json?t=${ts}`).catch(()=>null), fetch(`./data/theories.json?t=${ts}`).catch(()=>null)]);
        if(qRes && qRes.ok) allQuizData = await qRes.json(); if(iRes && iRes.ok) allInterviewData = await iRes.json();
        if(tRes && tRes.ok) {
          const raw = await tRes.json();
          allTheories = raw.filter(t => !String(t.content || '').includes('채워질 예정')).map((t, idx) => ({ ...t, id: t.id || "T-" + idx, category: t.category || "기타", subject: t.subject || "일반" }));
        }
        applyState('view-lobby', learnState);
      } catch (e) {}
    }

    function navTo(viewId, newLearnState = null) {
      if (newLearnState) learnState = { ...learnState, ...newLearnState }; applyState(viewId, learnState);
    }
    function goBack() {
      if (currentViewId === 'view-learning' && document.getElementById('theorySearchInput').value.trim() !== '') {
        document.getElementById('theorySearchInput').value = ''; applyState('view-learning', learnState);
      } else { navTo('view-lobby'); }
    }
    function applyState(viewId, state) {
      ['view-lobby', 'view-setup', 'view-quiz', 'view-interview', 'view-learning', 'view-note', 'view-result'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden'); currentViewId = viewId;
      if (viewId === 'view-learning') {
        document.getElementById('theorySearchInput').value = '';
        if (state.level === 'home') renderHomeDOM(); else if (state.level === 'category') renderSubjectsDOM(state.category); else if (state.level === 'subject') renderTitlesDOM(state.category, state.subject); else if (state.level === 'detail') renderDetailDOM(state.theoryId);
      } else if (viewId === 'view-note') renderNoteDOM();
      applyMathRendering();
    }

    // 📖 백과사전 뷰 (max-w-2xl 사이즈에 맞춘 레이아웃)
    function renderHomeDOM() {
      renderBreadcrumb(); const container = document.getElementById('learningContainer'); container.className = "grid grid-cols-1 sm:grid-cols-2 gap-4"; container.innerHTML = '';
      const activeCats = FIXED_CATEGORIES.filter(cat => allTheories.some(t => t.category === cat));
      activeCats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = "group bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 hover:border-emerald-400 dark:hover:border-[#84cc9c] hover:shadow-md p-5 rounded-2xl text-left transition flex items-center gap-4 shadow-sm";
        btn.onclick = () => navTo('view-learning', { level: 'category', category: cat });
        btn.innerHTML = `<span class="w-12 h-12 shrink-0 rounded-xl bg-emerald-50 dark:bg-[#1a231c] border border-emerald-100 dark:border-[#2d4a36] flex items-center justify-center text-2xl">📁</span><div class="min-w-0 flex-1"><h3 class="text-base font-bold text-slate-900 dark:text-white leading-snug">${cat}</h3><span class="text-xs text-slate-500 dark:text-slate-400 mt-1 block">문서 ${allTheories.filter(t => t.category === cat).length}개</span></div><span class="text-slate-300 dark:text-slate-600 group-hover:text-emerald-500 dark:group-hover:text-[#84cc9c] text-2xl leading-none transition">›</span>`;
        container.appendChild(btn);
      });
    }

    function renderSubjectsDOM(category) {
      renderBreadcrumb(); const container = document.getElementById('learningContainer'); container.className = "grid grid-cols-1 sm:grid-cols-2 gap-4"; container.innerHTML = '';
      const activeSubs = FIXED_SUBJECTS.filter(sub => allTheories.some(t => t.category === category && t.subject === sub));
      activeSubs.forEach(sub => {
        const btn = document.createElement('button');
        btn.className = "group bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 hover:border-emerald-400 dark:hover:border-[#84cc9c] hover:shadow-md p-5 rounded-2xl text-left transition flex items-center gap-4 shadow-sm";
        btn.onclick = () => navTo('view-learning', { level: 'subject', category: category, subject: sub });
        btn.innerHTML = `<span class="w-12 h-12 shrink-0 rounded-xl bg-emerald-50 dark:bg-[#1a231c] border border-emerald-100 dark:border-[#2d4a36] flex items-center justify-center text-2xl">📂</span><div class="min-w-0 flex-1"><h3 class="text-base font-bold text-slate-900 dark:text-white leading-snug">${sub}</h3><span class="text-xs text-slate-500 dark:text-slate-400 mt-1 block">문서 ${allTheories.filter(t => t.category === category && t.subject === sub).length}개</span></div><span class="text-slate-300 dark:text-slate-600 group-hover:text-emerald-500 dark:group-hover:text-[#84cc9c] text-2xl leading-none transition">›</span>`;
        container.appendChild(btn);
      });
    }

    function renderTitlesDOM(category, subject) {
      renderBreadcrumb(); const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-3"; container.innerHTML = '';
      allTheories.filter(t => t.category === category && t.subject === subject).forEach(t => renderTitleCard(t, container));
    }

    function renderTitleCard(t, container) {
      const btn = document.createElement('button');
      btn.className = "bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 hover:border-emerald-400 dark:hover:border-[#84cc9c] hover:shadow-md p-5 rounded-xl text-left transition flex items-center w-full shadow-sm";
      btn.onclick = () => navTo('view-learning', { level: 'detail', theoryId: t.id });
      btn.innerHTML = `<span class="text-2xl mr-4">📄</span><div><h3 class="text-lg font-bold text-slate-900 dark:text-white leading-snug">${t.title}</h3><div class="mt-2 flex flex-wrap gap-1">${(t.tags || []).map(tag => `<span class="bg-emerald-50 dark:bg-[#1a231c] text-emerald-700 dark:text-[#84cc9c] text-[10px] px-2 py-0.5 rounded font-bold">#${tag}</span>`).join('')}</div></div>`;
      container.appendChild(btn);
    }

        // 수식($...$, $$...$$)을 marked가 건드리지 못하게 잠시 빼 두었다가 되돌림
    function stashMath(md) {
      const stash = [];
      const hold = (m) => { stash.push(m); return `@@MATH${stash.length - 1}@@`; };
      const text = String(md || '').replace(/\$\$[\s\S]+?\$\$/g, hold).replace(/\$[^$\n]+?\$/g, hold);
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return { text, restore: (html) => html.replace(/@@MATH(\d+)@@/g, (_, i) => esc(stash[Number(i)])) };
    }
    
    function renderDetailDOM(theoryId) {
      const t = allTheories.find(x => x.id === theoryId);
      const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-4"; container.innerHTML = '';
      const card = document.createElement('div'); card.className = "bg-white dark:bg-[#1a1d20] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden";
      const math = stashMath(t.content); let rawMarkdown = math.text;
      // '**용어(영문)**는' 처럼 괄호 뒤에 한글이 바로 붙으면 marked가 굵게 처리를 못 해서 ** 가 그대로 보임 -> 직접 변환
      rawMarkdown = rawMarkdown.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
      rawMarkdown = rawMarkdown.replace(/>\s*💡\s*(.*?)(?=\n\n|\n###|$)/gs, (match, p1) => `<div class="custom-highlight-box">${marked.parseInline(p1.trim())}</div>\n\n`);
      rawMarkdown = rawMarkdown.replace(/###\s*\[(.*?)\]\s*(.*)/g, (match, badgeText, titleText) => `<div class="custom-badge-heading"><span class="custom-badge">${badgeText}</span>${titleText}</div>`);
      
      card.innerHTML = `
        <div class="p-6 md:p-8">
          <h2 class="text-2xl font-black text-slate-900 dark:text-white mb-4 leading-tight">${t.title}</h2>
          <div class="custom-table-container prose prose-slate dark:prose-invert max-w-none text-sm md:text-base leading-relaxed dark:text-slate-300">
            ${math.restore(marked.parse(rawMarkdown))}
          </div>
        </div>
        <div class="bg-slate-50 dark:bg-[#1a231c] p-6 border-t border-slate-200 dark:border-[#2d4a36]">
          <button onclick="startMiniQuiz('${t.title}')" class="w-full bg-indigo-600 dark:bg-[#84cc9c] hover:bg-indigo-700 dark:hover:bg-[#6ab382] text-white dark:text-[#111315] font-black text-base py-4 rounded-xl shadow-md transition flex items-center justify-center gap-2">
            <span class="text-xl">🧩</span> 실전 기출 풀기 ➔
          </button>
        </div>
      `;
      container.appendChild(card);
      applyMathRendering();
    }

    function startMiniQuiz(keyword) {
      filteredSession = allQuizData.filter(q => q.category.includes(keyword) || q.topic.includes(keyword) || q.question.includes(keyword));
      if (filteredSession.length === 0) return alert("현재 등록된 관련된 기출문제가 없습니다.");
      filteredSession = filteredSession.sort(() => Math.random() - 0.5).slice(0, 3);
      currentIndex = 0; correctCount = 0; currentMode = 'quiz'; navTo('view-quiz'); renderQuiz();
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumbContainer'); bc.classList.remove('hidden');
      bc.innerHTML = `<button onclick="navTo('view-learning', {level:'home'})" class="text-emerald-700 dark:text-[#84cc9c] font-bold px-2 hover:underline">📚 백과사전</button>`;
      if (learnState.level !== 'home') bc.innerHTML += `<span class="text-emerald-200 dark:text-[#2d4a36]">❯</span><button onclick="navTo('view-learning', {level:'category', category: '${learnState.category}'})" class="text-slate-600 dark:text-white font-bold px-2 hover:underline">${learnState.category}</button>`;
      if (learnState.level === 'subject' || learnState.level === 'detail') bc.innerHTML += `<span class="text-emerald-200 dark:text-[#2d4a36]">❯</span><button onclick="navTo('view-learning', {level:'subject', category: '${learnState.category}', subject: '${learnState.subject}'})" class="text-slate-600 dark:text-white font-bold px-2 hover:underline">${learnState.subject}</button>`;
    }

    function handleTheorySearch() {
      const query = document.getElementById('theorySearchInput').value.trim().toLowerCase();
      if (!query) return applyState('view-learning', learnState);
      document.getElementById('breadcrumbContainer').classList.add('hidden');
      const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-3"; container.innerHTML = '';
      const res = allTheories.filter(t => t.title.toLowerCase().includes(query) || t.content.toLowerCase().includes(query));
      if (res.length === 0) container.innerHTML = `<div class="bg-white dark:bg-[#1a1d20] p-6 text-center text-slate-400 rounded-xl">검색 결과가 없습니다.</div>`;
      else res.forEach(t => renderTitleCard(t, container));
    }

    function openSetup(mode) { currentMode = mode; document.getElementById('setupTitle').innerText = mode === 'quiz' ? "📝 객관식 설정" : "🗣️ 면접 설정"; navTo('view-setup'); }
    function startSession() {
      const sub = document.getElementById('select-subject').value; const cnt = document.getElementById('select-count').value;
      const data = currentMode === 'quiz' ? allQuizData : allInterviewData;
      filteredSession = data.filter(q => sub === "ALL" || (q.category && q.category.includes(sub)));
      if (filteredSession.length === 0) return alert("문항이 없습니다.");
      filteredSession = filteredSession.sort(() => Math.random() - 0.5); if (cnt !== "ALL") filteredSession = filteredSession.slice(0, parseInt(cnt));
      currentIndex = 0; correctCount = 0; navTo(currentMode === 'quiz' ? 'view-quiz' : 'view-interview');
      if (currentMode === 'quiz') renderQuiz(); else renderInterview();
    }
    
    function renderQuiz() {
      const q = filteredSession[currentIndex];
      document.getElementById('qBadge').innerText = `${q.category} (${q.difficulty})`; document.getElementById('qProgress').innerText = `${currentIndex + 1} / ${filteredSession.length}`; document.getElementById('qTitle').innerText = q.question;
      const star = document.getElementById('starBtn'); star.innerText = starredIds.includes(q.id) ? "★" : "☆"; star.className = starredIds.includes(q.id) ? "text-3xl text-amber-400" : "text-3xl text-slate-300 dark:text-slate-600";
      const opts = document.getElementById('qOptions'); opts.innerHTML = ''; document.getElementById('qExpBox').classList.add('hidden');
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button'); 
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-[#1a1d20] hover:bg-indigo-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 text-sm flex items-center transition";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 flex items-center justify-center text-xs mr-3 font-bold">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => checkAnswer(idx, q); opts.appendChild(btn);
      });
      applyMathRendering();
    }
    function checkAnswer(idx, q) {
      Array.from(document.getElementById('qOptions').children).forEach(b => b.disabled = true); document.getElementById('qExpBox').classList.remove('hidden');
      const st = document.getElementById('qStatus');
      if (idx === q.answer) { correctCount++; st.className = "font-bold text-emerald-600 dark:text-[#84cc9c] mb-1"; st.innerText = "⭕ 정답!"; } else { st.className = "font-bold text-rose-500 dark:text-rose-400 mb-1"; st.innerText = `❌ 오답 (정답: ${q.answer + 1}번)`; }
      document.getElementById('qExpText').innerText = q.explanation;
      const nxt = document.getElementById('qNextBtn');
      if (currentIndex === filteredSession.length - 1) { nxt.innerText = "종료"; nxt.onclick = () => { navTo('view-result'); document.getElementById('scoreText').innerText = Math.round((correctCount/filteredSession.length)*100); }; } else { nxt.innerText = "다음"; nxt.onclick = () => { currentIndex++; renderQuiz(); }; }
      applyMathRendering();
    }
    function renderInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iBadge').innerText = i.category; document.getElementById('iProgress').innerText = `${currentIndex+1}/${filteredSession.length}`; document.getElementById('iTitle').innerText = i.question;
      document.getElementById('iRevealBtn').classList.remove('hidden'); document.getElementById('iExpBox').classList.add('hidden');
      applyMathRendering();
    }
    function revealInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iRevealBtn').classList.add('hidden'); document.getElementById('iExpBox').classList.remove('hidden');
      document.getElementById('iKeywords').innerHTML = (i.key_points||[]).map(k=>`<span class="bg-rose-100 dark:bg-rose-900/30 text-rose-700 dark:text-rose-400 px-2 py-1 rounded text-xs font-bold">#${k}</span>`).join('');
      document.getElementById('iAnsText').innerText = i.interview_answer;
      const nxt = document.getElementById('iNextBtn');
      if(currentIndex === filteredSession.length-1) { nxt.innerText = "종료"; nxt.onclick = ()=>navTo('view-lobby'); } else { nxt.innerText = "다음"; nxt.onclick = ()=>{currentIndex++; renderInterview();} }
      applyMathRendering();
    }
    function renderNoteDOM() {
      const c = document.getElementById('noteContainer'); c.innerHTML = '';
      const sq = allQuizData.filter(q => starredIds.includes(q.id));
      if(sq.length===0) return c.innerHTML = `<div class="bg-white dark:bg-[#1a1d20] p-6 rounded-2xl text-center text-slate-400 border border-slate-200 dark:border-slate-800">오답노트가 비어있습니다.</div>`;
      sq.forEach(q => {
        const d = document.createElement('div'); d.className="bg-white dark:bg-[#1a1d20] rounded-2xl p-5 border border-slate-200 dark:border-slate-800";
        d.innerHTML = `<div class="flex justify-between items-center mb-3"><span class="bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400 text-xs px-2 py-1 rounded font-bold">${q.category}</span><button onclick="removeNote('${q.id}')" class="text-xs text-rose-500 dark:text-rose-400 font-bold">삭제</button></div><h3 class="mb-4 font-bold dark:text-white">${q.question}</h3><button onclick="document.getElementById('ans-${q.id}').classList.toggle('hidden')" class="w-full bg-slate-100 dark:bg-[#111315] hover:bg-slate-200 text-slate-600 dark:text-slate-300 py-2 rounded-lg text-sm font-bold">해설 토글 ↕</button><div id="ans-${q.id}" class="hidden bg-slate-50 dark:bg-[#111315] p-4 rounded-lg mt-3 border border-slate-100 dark:border-slate-800"><span class="text-emerald-600 dark:text-[#84cc9c] mb-2 block font-bold">정답: ${q.options[q.answer]}</span><p class="text-sm text-slate-600 dark:text-slate-400 leading-relaxed">${q.explanation}</p></div>`;
        c.appendChild(d);
      });
      applyMathRendering();
    }
    function removeNote(id) { starredIds = starredIds.filter(x=>x!==id); localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds)); renderNoteDOM(); }
    function toggleStar() {
      const id = filteredSession[currentIndex].id; const s = document.getElementById('starBtn');
      if(starredIds.includes(id)) { starredIds = starredIds.filter(x=>x!==id); s.innerText="☆"; s.className="text-3xl text-slate-300 dark:text-slate-600"; } else { starredIds.push(id); s.innerText="★"; s.className="text-3xl text-amber-400"; }
      localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds));
    }
    // ===== 🚨 오류 제보 =====
    let reportTarget = null;
    function setReportMsg(text, kind) {
      const el = document.getElementById('reportMsg');
      el.textContent = text;
      el.className = 'text-xs mt-2 min-h-[1rem] ' + (kind === 'err' ? 'text-rose-500' : kind === 'ok' ? 'text-emerald-500' : 'text-slate-400');
    }
    function openReportModal() {
      const item = filteredSession[currentIndex];
      if (!item) return;
      reportTarget = { id: String(item.id || ''), text: String(item.question || '').slice(0, 120) };
      const short = reportTarget.text.length > 40 ? reportTarget.text.slice(0, 40) + '…' : reportTarget.text;
      document.getElementById('reportTarget').textContent = `대상: ${reportTarget.id} · ${short}`;
      document.getElementById('reportContent').value = '';
      document.getElementById('reportSubmitBtn').disabled = false;
      setReportMsg('', '');
      const m = document.getElementById('reportModal'); m.classList.remove('hidden'); m.classList.add('flex');
      setTimeout(() => document.getElementById('reportContent').focus(), 50);
    }
    function closeReportModal() {
      const m = document.getElementById('reportModal'); m.classList.remove('flex'); m.classList.add('hidden');
    }
    async function submitReport() {
      if (!reportTarget) return;
      const content = document.getElementById('reportContent').value.trim();
      if (content.length < 5) return setReportMsg('5자 이상 적어 주세요.', 'err');
      let last = 0; try { last = Number(localStorage.getItem('semiCbtLastReport') || 0); } catch (e) {}
      if (Date.now() - last < 15000) return setReportMsg('잠시 후 다시 제보해 주세요.', 'err');
      if (!supabaseClient) return setReportMsg('서버 연결에 실패했습니다. 새로고침 후 다시 시도해 주세요.', 'err');

      const btn = document.getElementById('reportSubmitBtn');
      btn.disabled = true; setReportMsg('전송 중...', 'info');
      const { error } = await supabaseClient.from('error_reports').insert({
        question_id: reportTarget.id,
        question_text: reportTarget.text,
        content: content,
        status: 'pending'
      });
      if (error) {
        console.error('제보 실패:', error);
        btn.disabled = false;
        return setReportMsg('전송 실패: ' + (error.message || '알 수 없는 오류'), 'err');
      }
      try { localStorage.setItem('semiCbtLastReport', String(Date.now())); } catch (e) {}
      setReportMsg('✅ 제보가 접수되었습니다. 감사합니다!', 'ok');
      setTimeout(closeReportModal, 1200);
    }
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeReportModal(); });
    initApp();
  </script>
</body>
</html>
