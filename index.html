<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 반도체 직무 전공 AI 플랫폼</title>
  
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✨ 첨부해주신 이미지 스타일 커스텀 CSS -->
  <style>
    /* 하이라이트 박스 (전구 아이콘) */
    .custom-highlight-box {
      background-color: #1a231c; /* 어두운 녹색 배경 */
      border: 1px solid #2d4a36;
      border-left: 6px solid #84cc9c; /* 왼쪽 두꺼운 라인 */
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.6;
      display: flex;
      gap: 12px;
    }
    .custom-highlight-box::before {
      content: '💡';
      font-size: 1.25rem;
    }
    
    /* 뱃지형 소제목 */
    .custom-badge-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 3rem;
      margin-bottom: 1.5rem;
      font-size: 1.25rem;
      font-weight: 800;
      color: #f8fafc;
    }
    .custom-badge {
      background-color: #2d4a36;
      color: #84cc9c;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .custom-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #84cc9c;
      border-radius: 50%;
    }

    /* 테이블 스타일 커스텀 */
    .custom-table-container table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 1rem;
      margin-bottom: 2rem;
      background-color: #1e293b;
    }
    .custom-table-container th {
      background-color: #253328;
      color: #84cc9c;
      text-align: left;
      padding: 1rem;
      font-weight: 700;
    }
    .custom-table-container td {
      padding: 1rem;
      border-bottom: 1px solid #334155;
      color: #cbd5e1;
    }
    .custom-table-container tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<!-- ✨ 배경색을 첨부 이미지처럼 더 어둡고 차분하게 변경 -->
<body class="bg-slate-50 dark:bg-[#111315] text-slate-800 dark:text-slate-200 antialiased min-h-screen flex flex-col relative transition-colors duration-200">

  <header class="bg-indigo-900 dark:bg-[#1a1d20] text-white p-4 shadow-md flex justify-between items-center relative z-10 border-b dark:border-slate-800">
    <h1 class="text-xl font-bold tracking-tight cursor-pointer" onclick="navTo('view-lobby')">⚡ SemiCBT</h1>
    <div class="flex items-center gap-2">
      <button onclick="toggleTheme()" id="themeToggleBtn" class="text-lg bg-indigo-800 dark:bg-slate-800 hover:bg-indigo-700 w-8 h-8 rounded-full flex items-center justify-center transition shadow-inner">🌙</button>
      <button class="bg-indigo-700 hover:bg-indigo-600 dark:bg-slate-800 dark:hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg transition" onclick="navTo('view-lobby')">🏠 홈</button>
    </div>
  </header>

  <!-- ✨ 전체 레이아웃 너비를 대폭 확장 (max-w-4xl) -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-start py-8">
    
    <!-- 🏠 메인 로비 -->
    <div id="view-lobby" class="w-full flex flex-col space-y-4">
      <div class="bg-white dark:bg-[#1a1d20] rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8 text-center mb-4 transition-colors">
        <h2 class="text-2xl font-bold text-slate-800 dark:text-white mb-2">반도체 취업 마스터</h2>
        <p class="text-slate-500 dark:text-slate-400 text-sm">원하는 학습 모드를 선택하세요.</p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <button onclick="navTo('view-learning', {level: 'home'})" class="bg-emerald-50 dark:bg-[#1a231c] hover:bg-emerald-100 dark:hover:bg-[#253328] border border-emerald-200 dark:border-[#2d4a36] text-emerald-800 dark:text-[#84cc9c] p-8 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-4xl mb-3">📖</span><span class="font-bold text-base">이론 백과사전</span>
        </button>
        <button onclick="navTo('view-note')" class="bg-amber-50 dark:bg-amber-900/10 hover:bg-amber-100 border border-amber-200 dark:border-amber-800/30 text-amber-800 dark:text-amber-400 p-8 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-4xl mb-3">⭐</span><span class="font-bold text-base">오답 노트</span>
        </button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <button onclick="openSetup('quiz')" class="bg-indigo-50 dark:bg-indigo-900/10 hover:bg-indigo-100 border border-indigo-200 dark:border-indigo-800/30 text-indigo-800 dark:text-indigo-400 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">📝</span><span class="font-bold text-lg">객관식 전공 시험</span>
        </button>
        <button onclick="openSetup('interview')" class="bg-rose-50 dark:bg-rose-900/10 hover:bg-rose-100 border border-rose-200 dark:border-rose-800/30 text-rose-800 dark:text-rose-400 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
          <span class="text-3xl mb-2">🗣️</span><span class="font-bold text-lg">실무 면접 대비</span>
        </button>
      </div>
    </div>

    <!-- (설정, 퀴즈, 면접, 결과, 제보 코드는 기존 유지 - 길이 상 HTML 구조 생략 없이 이전 코드 그대로 적용됨) -->
    <!-- ⚙️ 공통 설정 화면 -->
    <div id="view-setup" class="hidden w-full flex flex-col max-w-2xl mx-auto">
      <button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit">⬅️ 뒤로</button>
      <div class="bg-white dark:bg-[#1a1d20] rounded-2xl border border-slate-200 dark:border-slate-800 p-6">
        <h2 id="setupTitle" class="text-xl font-bold dark:text-white mb-6">설정</h2>
        <div class="mb-4">
          <select id="select-subject" class="w-full bg-slate-50 dark:bg-[#111315] border dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-lg p-3 outline-none"><option value="ALL">✨ 전체 과목 통합</option><option value="반도체 기초 이론">반도체 기초 이론</option><option value="반도체 8대 공정">반도체 8대 공정</option><option value="차세대 첨단 기술">차세대 첨단 기술</option></select>
        </div>
        <div class="mb-8">
          <select id="select-count" class="w-full bg-slate-50 dark:bg-[#111315] border dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-lg p-3 outline-none"><option value="ALL">최대 (모두 풀기)</option><option value="5">5개</option><option value="10">10개</option></select>
        </div>
        <button onclick="startSession()" class="w-full bg-slate-800 dark:bg-indigo-600 text-white font-bold py-3.5 rounded-xl">시작하기</button>
      </div>
    </div>

    <!-- 📝 퀴즈 & 면접 & 노트 등 (이전 코드 완전 동일 적용됨) -->
    <div id="view-quiz" class="hidden w-full flex flex-col max-w-2xl mx-auto"><button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit">⬅️ 종료</button><div class="bg-white dark:bg-[#1a1d20] rounded-2xl border border-slate-200 dark:border-slate-800 p-6"><div class="flex justify-between items-center mb-4"><div><span id="qBadge" class="bg-indigo-100 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-400 text-xs font-semibold px-2.5 py-1 rounded mr-2">과목</span><span id="qProgress" class="text-xs text-slate-400 font-medium">1/10</span></div><button onclick="toggleStar()" id="starBtn" class="text-3xl outline-none">☆</button></div><h2 id="qTitle" class="text-lg font-bold dark:text-white mb-6">지문</h2><div id="qOptions" class="space-y-3"></div><div id="qExpBox" class="mt-6 p-4 bg-slate-50 dark:bg-[#111315] border border-slate-200 dark:border-slate-800 rounded-xl hidden"><div id="qStatus" class="font-bold text-sm mb-2"></div><p id="qExpText" class="text-sm dark:text-slate-300 mb-4"></p><div class="flex gap-2"><button onclick="openReportModal()" class="w-1/3 bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-400 py-2.5 rounded-lg text-sm font-semibold">🚨 제보</button><button id="qNextBtn" onclick="nextQuiz()" class="w-2/3 bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold">다음</button></div></div></div></div>
    <div id="view-interview" class="hidden w-full flex flex-col max-w-2xl mx-auto"><button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3 w-fit">⬅️ 종료</button><div class="bg-white dark:bg-[#1a1d20] rounded-2xl border dark:border-slate-800 p-6"><div class="mb-4"><span id="iBadge" class="bg-rose-100 dark:bg-rose-900/30 text-rose-700 dark:text-rose-400 text-xs font-semibold px-2.5 py-1 rounded mr-2">면접</span><span id="iProgress" class="text-xs text-slate-400 font-medium">1/10</span></div><h2 id="iTitle" class="text-lg font-bold dark:text-white mb-6">지문</h2><button id="iRevealBtn" onclick="revealInterview()" class="w-full bg-slate-50 dark:bg-[#111315] text-slate-600 dark:text-slate-400 font-bold py-12 rounded-xl border-2 border-dashed dark:border-slate-700">🤔 답변 후 클릭</button><div id="iExpBox" class="mt-6 p-4 bg-rose-50 dark:bg-[#111315] rounded-xl hidden"><div id="iKeywords" class="flex flex-wrap gap-2 mb-4"></div><p id="iAnsText" class="text-sm dark:text-slate-300 mb-4"></p><div class="flex gap-2"><button onclick="openReportModal()" class="w-1/3 border dark:border-slate-700 text-rose-400 py-2.5 rounded-lg text-sm font-semibold">🚨 제보</button><button id="iNextBtn" onclick="nextInterview()" class="w-2/3 bg-slate-800 text-white py-2.5 rounded-lg text-sm font-semibold">다음</button></div></div></div></div>
    <div id="view-result" class="hidden w-full flex flex-col max-w-2xl mx-auto"><button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3">⬅️ 홈으로</button><div class="bg-white dark:bg-[#1a1d20] rounded-2xl border dark:border-slate-800 p-8 text-center"><h2 class="text-2xl font-bold dark:text-white mb-2">모의고사 완료!</h2><div class="flex justify-center my-6"><div class="w-32 h-32 rounded-full border-8 border-indigo-500 flex flex-col items-center justify-center"><span id="scoreText" class="text-3xl font-black text-indigo-600 dark:text-indigo-400">80</span></div></div><p id="scoreDetail" class="mb-6 dark:text-slate-300">결과</p><button onclick="navTo('view-lobby')" class="w-full bg-slate-800 text-white font-bold py-3.5 rounded-xl">로비로</button></div></div>
    <div id="view-note" class="hidden w-full flex flex-col max-w-2xl mx-auto"><button onclick="goBack()" class="text-slate-400 font-bold text-sm mb-3">⬅️ 뒤로</button><div class="bg-white dark:bg-[#1a1d20] rounded-2xl border dark:border-slate-800 p-6 mb-4 text-center"><h2 class="text-xl font-bold dark:text-white">⭐ 오답노트</h2></div><div id="noteContainer" class="space-y-4"></div></div>

    <!-- 📖 ✨ 완벽 개편된 이론 백과사전 (넓은 뷰 적용) ✨ -->
    <div id="view-learning" class="hidden w-full flex flex-col">
      <button onclick="goBack()" class="text-slate-400 hover:text-slate-200 font-bold text-sm mb-4 transition w-fit outline-none">⬅️ 돌아가기</button>
      
      <div class="mb-6 relative">
        <input type="text" id="theorySearchInput" onkeyup="handleTheorySearch()" placeholder="🔍 키워드, 기술명 검색..." class="w-full bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-200 rounded-2xl p-5 shadow-sm outline-none focus:border-[#84cc9c] transition font-medium text-lg">
      </div>
      
      <div id="breadcrumbContainer" class="bg-[#1a231c] rounded-xl border border-[#2d4a36] p-4 mb-6 flex flex-wrap items-center shadow-sm gap-y-2 text-base hidden"></div>
      
      <!-- 이론 리스트/디테일이 그려질 넓은 캔버스 -->
      <div id="learningContainer" class="grid grid-cols-1 gap-6"></div>
    </div>

  </main>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      document.getElementById('themeToggleBtn').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    }
    window.addEventListener('DOMContentLoaded', () => { document.getElementById('themeToggleBtn').innerText = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; });

    const SUPABASE_URL = "https://hyqsrajudsymexxuekfb.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5cXNyYWp1ZHN5bWV4eHVla2ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzA0MDEsImV4cCI6MjEwOTcwNjQwMX0.6OPx9ClxjCnIfGcCFwYhgbWICcpgBI1cvx1QcAyVvIY"; 
    let supabaseClient; try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

    let allQuizData = []; let allInterviewData = []; let allTheories = []; let filteredSession = [];   
    let currentIndex = 0; let correctCount = 0; let currentMode = 'quiz';
    let starredIds = JSON.parse(localStorage.getItem('semiCbtStarred')) || [];
    const FIXED_CATEGORIES = ["반도체 기초 이론", "반도체 8대 공정", "차세대 첨단 기술"];
    const FIXED_SUBJECTS = ["반도체 물리", "트랜지스터 소자", "메모리 반도체", "1. 웨이퍼 제조 공정", "2. 산화 공정 (Oxidation)", "3. 포토 공정 (Photo)", "4. 식각 공정 (Etching)", "5. 박막 증착 공정 (Deposition)", "6. 금속 배선 공정 (Metallization)", "7. EDS 공정 (Testing)", "8. 패키징 공정 (Packaging)", "차세대 소자 기술", "어드밴스드 패키징"];
    let currentViewId = 'view-lobby'; let learnState = { level: 'home', category: '', subject: '', theoryId: '' };

    async function initApp() {
      try {
        const ts = new Date().getTime();
        const [qRes, iRes, tRes] = await Promise.all([fetch(`./data/questions.json?t=${ts}`).catch(()=>null), fetch(`./data/interviews.json?t=${ts}`).catch(()=>null), fetch(`./data/theories.json?t=${ts}`).catch(()=>null)]);
        if(qRes && qRes.ok) allQuizData = await qRes.json(); if(iRes && iRes.ok) allInterviewData = await iRes.json();
        if(tRes && tRes.ok) {
          const raw = await tRes.json();
          allTheories = raw.map((t, idx) => ({ ...t, id: t.id || "T-" + idx, category: t.category || "기타", subject: t.subject || "일반" }));
        }
        applyState('view-lobby', learnState);
      } catch (e) {}
    }

    function navTo(viewId, newLearnState = null) {
      if (newLearnState) learnState = { ...learnState, ...newLearnState };
      applyState(viewId, learnState);
    }
    function goBack() {
      if (currentViewId === 'view-learning' && document.getElementById('theorySearchInput').value.trim() !== '') {
        document.getElementById('theorySearchInput').value = ''; applyState('view-learning', learnState);
      } else { navTo('view-lobby'); }
    }
    function applyState(viewId, state) {
      ['view-lobby', 'view-setup', 'view-quiz', 'view-interview', 'view-learning', 'view-note', 'view-result'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById(viewId).classList.remove('hidden');
      currentViewId = viewId;
      if (viewId === 'view-learning') {
        document.getElementById('theorySearchInput').value = '';
        if (state.level === 'home') renderHomeDOM(); else if (state.level === 'category') renderSubjectsDOM(state.category); else if (state.level === 'subject') renderTitlesDOM(state.category, state.subject); else if (state.level === 'detail') renderDetailDOM(state.theoryId);
      } else if (viewId === 'view-note') renderNoteDOM();
    }

    // 📖 이론 백과사전 메뉴 렌더링
    function renderHomeDOM() {
      renderBreadcrumb(); const container = document.getElementById('learningContainer'); container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"; container.innerHTML = '';
      [...new Set(allTheories.map(t => t.category))].forEach(cat => {
        const btn = document.createElement('button');
        btn.className = "bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 hover:border-[#84cc9c] dark:hover:border-[#84cc9c] p-8 rounded-2xl text-left transition flex justify-between items-center group";
        btn.onclick = () => navTo('view-learning', { level: 'category', category: cat });
        btn.innerHTML = `<div><h3 class="text-xl font-bold dark:text-white">${cat}</h3><span class="text-sm text-slate-400 mt-2 block">총 ${allTheories.filter(t => t.category === cat).length}개의 문서</span></div><span class="text-slate-600 group-hover:text-[#84cc9c] text-2xl font-bold">➔</span>`;
        container.appendChild(btn);
      });
    }

    function renderSubjectsDOM(category) {
      renderBreadcrumb(); const container = document.getElementById('learningContainer'); container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"; container.innerHTML = '';
      [...new Set(allTheories.filter(t => t.category === category).map(t => t.subject))].forEach(sub => {
        const btn = document.createElement('button');
        btn.className = "bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 hover:bg-[#1a231c] p-6 rounded-2xl text-left transition";
        btn.onclick = () => navTo('view-learning', { level: 'subject', category: category, subject: sub });
        btn.innerHTML = `<h3 class="text-lg font-bold text-[#84cc9c]">${sub}</h3><span class="text-sm text-slate-400 block mt-2">세부 문서 ${allTheories.filter(t => t.category === category && t.subject === sub).length}개 보기</span>`;
        container.appendChild(btn);
      });
    }

    function renderTitlesDOM(category, subject) {
      renderBreadcrumb(); const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-4"; container.innerHTML = '';
      allTheories.filter(t => t.category === category && t.subject === subject).forEach(t => renderTitleCard(t, container));
    }

    function renderTitleCard(t, container) {
      const btn = document.createElement('button');
      btn.className = "bg-white dark:bg-[#1a1d20] border border-slate-200 dark:border-slate-800 hover:border-[#84cc9c] p-6 rounded-2xl text-left transition flex items-center w-full";
      btn.onclick = () => navTo('view-learning', { level: 'detail', theoryId: t.id });
      btn.innerHTML = `<span class="text-3xl mr-5">📄</span><div><h3 class="text-xl font-bold dark:text-white leading-snug">${t.title}</h3><div class="mt-3 flex flex-wrap gap-2">${(t.tags || []).map(tag => `<span class="bg-[#1a231c] text-[#84cc9c] text-xs px-2 py-1 rounded font-bold">#${tag}</span>`).join('')}</div></div>`;
      container.appendChild(btn);
    }

    // ✨ 마크다운 렌더링 로직 (첨부 이미지 디자인 완벽 적용)
    function renderDetailDOM(theoryId) {
      const t = allTheories.find(x => x.id === theoryId);
      const container = document.getElementById('learningContainer');
      container.className = "flex flex-col space-y-6"; container.innerHTML = '';
      
      const card = document.createElement('div');
      card.className = "bg-white dark:bg-[#1a1d20] rounded-3xl shadow-lg border border-slate-200 dark:border-slate-800 overflow-hidden";
      
      // AI가 생성한 마크다운을 커스텀 HTML로 치환 (정규식 사용)
      let rawMarkdown = t.content;
      
      // 1. 하이라이트 박스 치환 (`> 💡 ...` -> `<div class="custom-highlight-box">...</div>`)
      rawMarkdown = rawMarkdown.replace(/>\s*💡\s*(.*?)(?=\n\n|\n###|$)/gs, (match, p1) => {
        return `<div class="custom-highlight-box">${marked.parseInline(p1.trim())}</div>\n\n`;
      });

      // 2. 뱃지 소제목 치환 (`### [뱃지명] 제목` -> 커스텀 UI)
      rawMarkdown = rawMarkdown.replace(/###\s*\[(.*?)\]\s*(.*)/g, (match, badgeText, titleText) => {
        return `<div class="custom-badge-heading"><span class="custom-badge">${badgeText}</span>${titleText}</div>`;
      });

      // 나머지 일반 마크다운 파싱
      const parsedMarkdown = marked.parse(rawMarkdown);
      
      card.innerHTML = `
        <div class="p-8 md:p-12">
          <h2 class="text-3xl md:text-4xl font-black text-slate-900 dark:text-white mb-4 leading-tight">${t.title}</h2>
          
          <div class="custom-table-container prose prose-slate dark:prose-invert max-w-none text-base md:text-lg leading-relaxed dark:text-slate-300">
            ${parsedMarkdown}
          </div>
        </div>
        <div class="bg-[#1a231c] p-8 border-t border-[#2d4a36]">
          <button onclick="startMiniQuiz('${t.title}')" class="w-full bg-[#84cc9c] hover:bg-[#6ab382] text-[#111315] font-black text-lg py-5 rounded-2xl shadow-md transition flex items-center justify-center gap-3">
            <span class="text-2xl">🧩</span> 방금 읽은 개념 실전 기출 풀기 ➔
          </button>
        </div>
      `;
      container.appendChild(card);
    }

    function startMiniQuiz(keyword) {
      filteredSession = allQuizData.filter(q => q.category.includes(keyword) || q.topic.includes(keyword) || q.question.includes(keyword));
      if (filteredSession.length === 0) return alert("현재 등록된 관련된 기출문제가 없습니다.");
      filteredSession = filteredSession.sort(() => Math.random() - 0.5).slice(0, 3);
      currentIndex = 0; correctCount = 0; currentMode = 'quiz'; navTo('view-quiz'); renderQuiz();
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumbContainer'); bc.classList.remove('hidden');
      bc.innerHTML = `<button onclick="navTo('view-learning', {level:'home'})" class="text-[#84cc9c] font-bold px-2 hover:underline">홈</button>`;
      if (learnState.level !== 'home') bc.innerHTML += `<span class="text-[#2d4a36]">❯</span><button onclick="navTo('view-learning', {level:'category', category: '${learnState.category}'})" class="text-white font-bold px-2 hover:underline">${learnState.category}</button>`;
      if (learnState.level === 'subject' || learnState.level === 'detail') bc.innerHTML += `<span class="text-[#2d4a36]">❯</span><button onclick="navTo('view-learning', {level:'subject', category: '${learnState.category}', subject: '${learnState.subject}'})" class="text-white font-bold px-2 hover:underline">${learnState.subject}</button>`;
    }

    function handleTheorySearch() {
      const query = document.getElementById('theorySearchInput').value.trim().toLowerCase();
      if (!query) return applyState('view-learning', learnState);
      document.getElementById('breadcrumbContainer').classList.add('hidden');
      const container = document.getElementById('learningContainer'); container.className = "flex flex-col space-y-4"; container.innerHTML = '';
      const res = allTheories.filter(t => t.title.toLowerCase().includes(query) || t.content.toLowerCase().includes(query));
      if (res.length === 0) container.innerHTML = `<div class="bg-white dark:bg-[#1a1d20] p-8 text-center text-slate-400 rounded-2xl">검색 결과가 없습니다.</div>`;
      else res.forEach(t => renderTitleCard(t, container));
    }

    // 퀴즈, 면접, 오답노트 등 코어 로직 보존 (기존과 동일하게 작동)
    function openSetup(mode) { currentMode = mode; document.getElementById('setupTitle').innerText = mode === 'quiz' ? "📝 객관식 설정" : "🗣️ 면접 설정"; navTo('view-setup'); }
    function startSession() {
      const sub = document.getElementById('select-subject').value; const cnt = document.getElementById('select-count').value;
      const data = currentMode === 'quiz' ? allQuizData : allInterviewData;
      filteredSession = data.filter(q => sub === "ALL" || (q.category && q.category.includes(sub)));
      if (filteredSession.length === 0) return alert("문항이 없습니다.");
      filteredSession = filteredSession.sort(() => Math.random() - 0.5); if (cnt !== "ALL") filteredSession = filteredSession.slice(0, parseInt(cnt));
      currentIndex = 0; correctCount = 0; navTo(currentMode === 'quiz' ? 'view-quiz' : 'view-interview');
      if (currentMode === 'quiz') renderQuiz(); else renderInterview();
    }
    function renderQuiz() {
      const q = filteredSession[currentIndex];
      document.getElementById('qBadge').innerText = `${q.category} (${q.difficulty})`; document.getElementById('qProgress').innerText = `${currentIndex + 1} / ${filteredSession.length}`; document.getElementById('qTitle').innerText = q.question;
      const star = document.getElementById('starBtn'); star.innerText = starredIds.includes(q.id) ? "★" : "☆"; star.className = starredIds.includes(q.id) ? "text-3xl text-amber-400" : "text-3xl text-slate-600";
      const opts = document.getElementById('qOptions'); opts.innerHTML = ''; document.getElementById('qExpBox').classList.add('hidden');
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button'); btn.className = "w-full text-left p-4 rounded-xl border dark:border-slate-800 hover:bg-[#1a231c] text-sm flex items-center";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-800 flex items-center justify-center text-xs mr-3 font-bold">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => checkAnswer(idx, q); opts.appendChild(btn);
      });
    }
    function checkAnswer(idx, q) {
      Array.from(document.getElementById('qOptions').children).forEach(b => b.disabled = true); document.getElementById('qExpBox').classList.remove('hidden');
      const st = document.getElementById('qStatus');
      if (idx === q.answer) { correctCount++; st.className = "font-bold text-[#84cc9c] mb-1"; st.innerText = "⭕ 정답!"; } else { st.className = "font-bold text-rose-400 mb-1"; st.innerText = `❌ 오답 (정답: ${q.answer + 1}번)`; }
      document.getElementById('qExpText').innerText = q.explanation;
      const nxt = document.getElementById('qNextBtn');
      if (currentIndex === filteredSession.length - 1) { nxt.innerText = "종료"; nxt.onclick = () => { navTo('view-result'); document.getElementById('scoreText').innerText = Math.round((correctCount/filteredSession.length)*100); }; } else { nxt.innerText = "다음"; nxt.onclick = () => { currentIndex++; renderQuiz(); }; }
    }
    function renderInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iBadge').innerText = i.category; document.getElementById('iProgress').innerText = `${currentIndex+1}/${filteredSession.length}`; document.getElementById('iTitle').innerText = i.question;
      document.getElementById('iRevealBtn').classList.remove('hidden'); document.getElementById('iExpBox').classList.add('hidden');
    }
    function revealInterview() {
      const i = filteredSession[currentIndex];
      document.getElementById('iRevealBtn').classList.add('hidden'); document.getElementById('iExpBox').classList.remove('hidden');
      document.getElementById('iKeywords').innerHTML = (i.key_points||[]).map(k=>`<span class="bg-rose-900/30 text-rose-400 px-2 py-1 rounded text-xs">#${k}</span>`).join('');
      document.getElementById('iAnsText').innerText = i.interview_answer;
      const nxt = document.getElementById('iNextBtn');
      if(currentIndex === filteredSession.length-1) { nxt.innerText = "종료"; nxt.onclick = ()=>navTo('view-lobby'); } else { nxt.innerText = "다음"; nxt.onclick = ()=>{currentIndex++; renderInterview();} }
    }
    function renderNoteDOM() {
      const c = document.getElementById('noteContainer'); c.innerHTML = '';
      const sq = allQuizData.filter(q => starredIds.includes(q.id));
      if(sq.length===0) return c.innerHTML = `<div class="bg-[#1a1d20] p-6 rounded-2xl text-center text-slate-400 border border-slate-800">오답노트가 비어있습니다.</div>`;
      sq.forEach(q => {
        const d = document.createElement('div'); d.className="bg-[#1a1d20] rounded-2xl p-5 border border-slate-800";
        d.innerHTML = `<div class="flex justify-between mb-3"><span class="text-amber-400 text-xs">${q.category}</span><button onclick="removeNote('${q.id}')" class="text-xs text-rose-400">삭제</button></div><h3 class="mb-4">${q.question}</h3><button onclick="document.getElementById('ans-${q.id}').classList.toggle('hidden')" class="w-full bg-[#111315] text-slate-300 py-2 rounded-lg text-sm">해설</button><div id="ans-${q.id}" class="hidden bg-[#111315] p-4 rounded-lg mt-3"><span class="text-[#84cc9c] mb-2 block">정답: ${q.options[q.answer]}</span><p class="text-sm text-slate-400">${q.explanation}</p></div>`;
        c.appendChild(d);
      });
    }
    function removeNote(id) { starredIds = starredIds.filter(x=>x!==id); localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds)); renderNoteDOM(); }
    function toggleStar() {
      const id = filteredSession[currentIndex].id; const s = document.getElementById('starBtn');
      if(starredIds.includes(id)) { starredIds = starredIds.filter(x=>x!==id); s.innerText="☆"; s.className="text-3xl text-slate-600"; } else { starredIds.push(id); s.innerText="★"; s.className="text-3xl text-amber-400"; }
      localStorage.setItem('semiCbtStarred', JSON.stringify(starredIds));
    }
    function openReportModal() { document.getElementById('reportModal').classList.replace('hidden', 'flex'); }
    function closeReportModal() { document.getElementById('reportModal').classList.replace('flex', 'hidden'); }
    initApp();
  </script>
</body>
</html>
