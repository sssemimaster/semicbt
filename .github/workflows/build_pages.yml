name: Build Theory Pages

# 이론마다 고유 주소의 정적 페이지(theory/<id>/), 이론 목록, sitemap.xml, robots.txt 를 만듭니다. (AI 호출 없음)
#  - 검수소에서 이론을 등재해 data/theories.json 이 바뀌면 자동 실행
#  - 봇이 만든 커밋(문체 변환·분류 이동 등)은 자동 실행을 일으키지 못하므로, 하루 한 번 점검 실행도 합니다.
#  - 수동 실행도 가능합니다. 사이트 주소가 자동으로 계산되지 않으면 저장소 Variables 에 SITE_URL 을 넣으세요.
on:
  push:
    paths:
      - 'data/theories.json'
      - 'scripts/build_pages.py'
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

concurrency:
  group: auto-content-generator
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install markdown

    - name: Build pages
      env:
        SITE_URL: ${{ vars.SITE_URL }}
      run: python scripts/build_pages.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add theory sitemap.xml robots.txt
        if git diff --staged --quiet; then
          echo "변경 사항 없음 - 커밋 생략"
          exit 0
        fi
        git commit -m "Build theory pages"
        for i in 1 2 3; do
          if git pull --rebase && git push; then
            exit 0
          fi
          echo "push 실패 ($i/3), 5초 후 재시도"
          git rebase --abort 2>/dev/null || true
          sleep 5
        done
        echo "::error::push 실패"
        exit 1
