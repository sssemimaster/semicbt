name: Add Diagrams to Theories (one-time)

# 이미 있는 이론에 '눌러 보는 그림'({{diagram:...}} 한 줄)을 넣습니다. (AI 호출 없음, 수동 실행 전용, 여러 번 돌려도 안전)
# 'dry_run' 을 true 로 두고 먼저 돌리면 파일은 바꾸지 않고 결과 목록만 로그에 보여 줍니다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 확인만 (파일 변경 없음) / false = 실제로 넣음"
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: auto-content-generator
  cancel-in-progress: false

jobs:
  add-diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Add diagrams
      run: |
        if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
          python scripts/add_diagrams.py --dry-run
        else
          python scripts/add_diagrams.py
        fi

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/
        if git diff --staged --quiet; then
          echo "변경 사항 없음 - 커밋 생략"
          exit 0
        fi
        git commit -m "Add diagrams to theories"
        for i in 1 2 3; do
          if git pull --rebase && git push; then
            exit 0
          fi
          echo "push 실패 ($i/3), 5초 후 재시도"
          git rebase --abort 2>/dev/null || true
          sleep 5
        done
        echo "::error::push 실패"
        exit 1
