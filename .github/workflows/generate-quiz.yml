name: Auto Content Generator (OpenAI)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai

    # 1. 객관식 및 면접 문제 생성
    - name: Run Questions Generator
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python scripts/generate_questions.py

    # 2. ✨ 추가됨: 1타 강사 이론 생성
    - name: Run Theories Generator
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python scripts/generate_theories.py

    # 3. 변경된 모든 파일을 깃허브에 밀어넣기
    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/questions.json data/draft_questions.json data/interviews.json data/draft_interviews.json data/theories.json data/draft_theories.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated new CBT and Theory contents" && git push)
