name: Review Existing Content (OpenAI)

# 이미 등재된 문제·면접을 새 검수 기준으로 점검해 '검수 대기열'에 넣습니다.
# 정식 목록은 건드리지 않고, 승인은 검수소에서 직접 합니다. (수동 실행 전용)
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "점검 대상 (quiz / interview / all)"
        default: "all"
        type: choice
        options: [all, quiz, interview]
      limit:
        description: "종류별로 한 번에 점검할 문항 수 (비용 조절용)"
        default: "12"
      preset:
        description: "품질/비용 프리셋 (비워두면 balanced)"
        default: ""
        type: choice
        options: ["", high, balanced, economy]

concurrency:
  group: auto-content-generator
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai

    - name: Review existing items
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        QUALITY_PRESET: ${{ github.event.inputs.preset || vars.QUALITY_PRESET || 'balanced' }}
      run: python scripts/review_existing.py --kind "${{ github.event.inputs.kind }}" --limit "${{ github.event.inputs.limit }}"

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/draft_questions.json data/draft_interviews.json
        if git diff --staged --quiet; then
          echo "변경 사항 없음 - 커밋 생략"
          exit 0
        fi
        git commit -m "Review existing content -> review queue"
        for i in 1 2 3; do
          if git pull --rebase && git push; then
            exit 0
          fi
          echo "push 실패 ($i/3), 5초 후 재시도"
          git rebase --abort 2>/dev/null || true
          sleep 5
        done
        echo "::error::push 실패"
        exit 1
