<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 관리자 검수 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">🛠️ 시험/면접 문항 통합 검수소 (Admin)</h1>
    <div class="text-xs text-slate-400">
      시험 대기: <span id="draftQCount" class="font-bold text-rose-400">0</span>개 | 
      면접 대기: <span id="draftICount" class="font-bold text-amber-400">0</span>개
    </div>
  </header>

  <main class="max-w-2xl w-full mx-auto p-4 py-8">
    
    <!-- 1차 보안 -->
    <div id="loginSection" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 text-center mt-10">
      <h2 class="text-xl font-bold mb-4">1차 보안: 관리자 비밀번호</h2>
      <input type="password" id="adminPin" placeholder="비밀번호 입력" class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl mb-4 text-center text-xl tracking-[0.5em] outline-none focus:border-indigo-500">
      <button onclick="checkAdmin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold transition shadow-md">1차 인증하기</button>
    </div>

    <!-- 2차 보안 -->
    <div id="authSection" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 mt-10 text-center">
      <h2 class="text-xl font-bold mb-4">2차 보안: GitHub 토큰 검증</h2>
      <input type="password" id="ghToken" placeholder="ghp_ 토큰 입력..." class="w-full bg-slate-50 border border-slate-200 p-4 rounded-xl mb-4 text-center tracking-wide outline-none focus:border-indigo-500">
      <button onclick="loadAdminData()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-3.5 rounded-xl font-bold transition shadow-md">대시보드 입장</button>
    </div>

    <div id="dashboardSection" class="hidden space-y-6">
      
      <!-- 탭 선택 버튼 -->
      <div class="flex bg-white p-1 rounded-2xl border border-slate-200 shadow-sm">
        <button onclick="switchTab('quiz')" id="tabQuizBtn" class="flex-1 py-3 font-bold text-sm rounded-xl bg-indigo-600 text-white transition">📝 시험 문제 검수</button>
        <button onclick="switchTab('interview')" id="tabInterviewBtn" class="flex-1 py-3 font-bold text-sm rounded-xl text-slate-500 transition">🗣️ 면접 문항 검수</button>
      </div>

      <!-- 실시간 제보함 -->
      <div class="bg-white rounded-2xl shadow-sm border border-rose-200 p-6">
        <h2 class="text-xl font-bold text-rose-600 mb-4 flex justify-between items-center">
          <span>🚨 실시간 유저 오류 제보함</span>
          <button onclick="loadReports()" class="text-xs bg-rose-50 text-rose-600 px-3 py-1 rounded-md font-semibold">새로고침</button>
        </h2>
        <div id="reportsList" class="space-y-3"><p class="text-sm text-slate-500 text-center py-2">불러오는 중...</p></div>
      </div>

      <!-- 시험 문제 검수 영역 -->
      <div id="reviewQuizContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 class="text-xl font-bold text-slate-800 mb-4">📝 객관식 시험 문제 검수</h2>
        <div id="qBox">
          <div class="mb-4"><span id="qCatBadge" class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded">과목</span></div>
          <h2 id="qTitle" class="text-lg font-bold text-slate-900 mb-6 leading-snug">지문</h2>
          <div id="qOptContainer" class="space-y-3"></div>
          <div id="qExpBox" class="mt-6 p-4 bg-slate-50 border border-slate-200 rounded-xl hidden">
            <div id="qResStatus" class="font-bold text-sm mb-2"></div>
            <p id="qExpText" class="text-sm text-slate-600"></p>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6">
            <button onclick="rejectContent('quiz')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold py-4 rounded-xl border">🗑️ 폐기</button>
            <button onclick="approveQuiz()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md">✅ 시험 문제 등재</button>
          </div>
        </div>
      </div>

      <!-- 면접 문항 검수 영역 (초기 숨김) -->
      <div id="reviewInterviewContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hidden">
        <h2 class="text-xl font-bold text-slate-800 mb-4">🗣️ 면접 시나리오 문항 검수</h2>
        <div id="iBox">
          <div class="mb-4"><span id="iCatBadge" class="bg-amber-100 text-amber-700 text-xs font-semibold px-2.5 py-1 rounded">과목</span></div>
          <h2 id="iTitle" class="text-lg font-bold text-slate-900 mb-4 leading-snug">면접 질문</h2>
          <div class="p-4 bg-slate-50 border rounded-xl mb-4">
            <span class="text-xs font-bold text-indigo-700 block mb-1">🗣️ 모범 두괄식 답변 스크립트:</span>
            <p id="iAnsText" class="text-sm text-slate-700 leading-relaxed"></p>
          </div>
          <div class="grid grid-cols-2 gap-4 mt-6">
            <button onclick="rejectContent('interview')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold py-4 rounded-xl border">🗑️ 폐기</button>
            <button onclick="approveInterview()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-md">✅ 면접 문항 등재</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const REPO_OWNER = "sssemimaster"; 
    const REPO_NAME = "semicbt";
    const SUPABASE_URL = "본인의_SUPABASE_URL_입력"; 
    const SUPABASE_KEY = "본인의_SUPABASE_KEY_입력"; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ADMIN_HASH = "a0fb59cbf3a0f758247bd19c2907df0c50bc718e91328ca82095a64f1bcb42da";

    let token = "";
    let draftQuizzes = [];
    let draftInterviews = [];
    let currentQuizIndex = 0;
    let currentInterviewIndex = 0;
    let activeTab = 'quiz';

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkAdmin() {
      const inputPin = document.getElementById('adminPin').value;
      if (await sha256(inputPin) === ADMIN_HASH) {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('authSection').classList.remove('hidden');
      } else { alert("비밀번호 틀림"); document.getElementById('adminPin').value = ""; }
    }

    async function loadAdminData() {
      token = document.getElementById('ghToken').value.trim();
      if(!token.startsWith("ghp_")) return alert("유효한 토큰이 아닙니다.");
      
      try {
        // 시험 대기소 로드
        const qFile = await fetchGitHubFile("data/draft_questions.json");
        draftQuizzes = JSON.parse(qFile.content);
        document.getElementById('draftQCount').innerText = draftQuizzes.length;

        // 면접 대기소 로드 (파일이 없으면 빈 배열 처리)
        try {
          const iFile = await fetchGitHubFile("data/draft_interviews.json");
          draftInterviews = JSON.parse(iFile.content);
        } catch(e) { draftInterviews = []; }
        document.getElementById('draftICount').innerText = draftInterviews.length;

        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('dashboardSection').classList.remove('hidden');

        if(draftQuizzes.length > 0) renderQuizReview();
        if(draftInterviews.length > 0) renderInterviewReview();
        loadReports();
      } catch (e) { alert("데이터 로드 실패"); console.error(e); }
    }

    function switchTab(tab) {
      activeTab = tab;
      if(tab === 'quiz') {
        document.getElementById('tabQuizBtn').className = "flex-1 py-3 font-bold text-sm rounded-xl bg-indigo-600 text-white transition";
        document.getElementById('tabInterviewBtn').className = "flex-1 py-3 font-bold text-sm rounded-xl text-slate-500 transition";
        document.getElementById('reviewQuizContainer').classList.remove('hidden');
        document.getElementById('reviewInterviewContainer').classList.add('hidden');
      } else {
        document.getElementById('tabInterviewBtn').className = "flex-1 py-3 font-bold text-sm rounded-xl bg-indigo-600 text-white transition";
        document.getElementById('tabQuizBtn').className = "flex-1 py-3 font-bold text-sm rounded-xl text-slate-500 transition";
        document.getElementById('reviewInterviewContainer').classList.remove('hidden');
        document.getElementById('reviewQuizContainer').classList.add('hidden');
      }
    }

    // --- 시험 문제 렌더링 및 승인 ---
    function renderQuizReview() {
      if(draftQuizzes.length === 0) {
        document.getElementById('qBox').innerHTML = "<p class='text-center py-6 text-slate-500 font-bold'>대기 중인 시험 문제가 없습니다.</p>";
        return;
      }
      const q = draftQuizzes[currentQuizIndex];
      document.getElementById('qCatBadge').innerText = `${q.category} > ${q.topic} (${q.difficulty})`;
      document.getElementById('qTitle').innerText = q.question;
      const optContainer = document.getElementById('qOptContainer'); optContainer.innerHTML = '';
      document.getElementById('qExpBox').classList.add('hidden');
      
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-indigo-50 font-medium text-sm flex items-center";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-xs mr-3 font-bold">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => {
          document.getElementById('qExpBox').classList.remove('hidden');
          const res = document.getElementById('qResStatus');
          if(idx === q.answer) { res.className = "font-bold text-sm mb-1 text-emerald-600"; res.innerText = "⭕ 정답입니다!"; }
          else { res.className = "font-bold text-sm mb-1 text-rose-600"; res.innerText = `❌ 오답 (정답: ${q.answer + 1}번)`; }
          document.getElementById('qExpText').innerText = q.explanation;
        };
        optContainer.appendChild(btn);
      });
    }

    async function approveQuiz() {
      const q = draftQuizzes[currentQuizIndex];
      if(!confirm("이 시험 문제를 정식 등재하시겠습니까?")) return;
      try {
        const live = await fetchGitHubFile("data/questions.json");
        let data = JSON.parse(live.content); data.unshift(q);
        await updateGitHubFile("data/questions.json", live.sha, JSON.stringify(data, null, 2), `Approve quiz ${q.id}`);
        
        draftQuizzes.splice(currentQuizIndex, 1);
        const draftFile = await fetchGitHubFile("data/draft_questions.json");
        await updateGitHubFile("data/draft_questions.json", draftFile.sha, JSON.stringify(draftQuizzes, null, 2), "Remove draft quiz");
        
        alert("✅ 시험 문제 등재 완료!");
        document.getElementById('draftQCount').innerText = draftQuizzes.length;
        renderQuizReview();
      } catch(e) { alert("등재 실패"); }
    }

    // --- 면접 문항 렌더링 및 승인 ---
    function renderInterviewReview() {
      if(draftInterviews.length === 0) {
        document.getElementById('iBox').innerHTML = "<p class='text-center py-6 text-slate-500 font-bold'>대기 중인 면접 문항이 없습니다.</p>";
        return;
      }
      const i = draftInterviews[currentInterviewIndex];
      document.getElementById('iCatBadge').innerText = `${i.category} > ${i.topic}`;
      document.getElementById('iTitle').innerText = i.question;
      document.getElementById('iAnsText').innerText = i.interview_answer;
    }

    async function approveInterview() {
      const i = draftInterviews[currentInterviewIndex];
      if(!confirm("이 면접 문항을 정식 등재하시겠습니까?")) return;
      try {
        // 면접 데이터 본섭 파일(interviews.json)에 등재
        let live;
        try { live = await fetchGitHubFile("data/interviews.json"); } 
        catch(e) { live = { sha: null, content: "[]" }; } // 파일 없으면 생성
        
        let data = JSON.parse(live.content); data.unshift(i);
        
        if(live.sha) {
          await updateGitHubFile("data/interviews.json", live.sha, JSON.stringify(data, null, 2), `Approve interview ${i.id}`);
        } else {
          // 첫 생성인 경우
          const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
          await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/data/interviews.json`, {
            method: "PUT", headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Create interviews.json", content: encoded })
          });
        }
        
        draftInterviews.splice(currentInterviewIndex, 1);
        const draftFile = await fetchGitHubFile("data/draft_interviews.json");
        await updateGitHubFile("data/draft_interviews.json", draftFile.sha, JSON.stringify(draftInterviews, null, 2), "Remove draft interview");
        
        alert("✅ 면접 문항 등재 완료!");
        document.getElementById('draftICount').innerText = draftInterviews.length;
        renderInterviewReview();
      } catch(e) { alert("등재 실패"); console.error(e); }
    }

    async function rejectContent(type) {
      if(!confirm("폐기하시겠습니까?")) return;
      if(type === 'quiz') {
        draftQuizzes.splice(currentQuizIndex, 1);
        const f = await fetchGitHubFile("data/draft_questions.json");
        await updateGitHubFile("data/draft_questions.json", f.sha, JSON.stringify(draftQuizzes, null, 2), "Reject quiz");
        document.getElementById('draftQCount').innerText = draftQuizzes.length;
        renderQuizReview();
      } else {
        draftInterviews.splice(currentInterviewIndex, 1);
        const f = await fetchGitHubFile("data/draft_interviews.json");
        await updateGitHubFile("data/draft_interviews.json", f.sha, JSON.stringify(draftInterviews, null, 2), "Reject interview");
        document.getElementById('draftICount').innerText = draftInterviews.length;
        renderInterviewReview();
      }
      alert("🗑️ 폐기되었습니다.");
    }

    // 제보함 로드
    async function loadReports() {
      const list = document.getElementById('reportsList');
      const { data } = await supabaseClient.from('error_reports').select('*').eq('status', 'pending').order('created_at', { ascending: false });
      if(!data || data.length === 0) { list.innerHTML = '<p class="text-xs text-emerald-600 font-bold text-center py-2">미처리 제보 없음</p>'; return; }
      list.innerHTML = '';
      data.forEach(r => {
        const div = document.createElement('div');
        div.className = "bg-rose-50 p-3 rounded-xl flex justify-between items-center text-sm";
        div.innerHTML = `<div><span class="font-bold text-rose-800">[ID: ${r.question_id}]</span> ${r.content}</div><button onclick="resolveReport(${r.id})" class="bg-rose-600 text-white px-3 py-1 rounded text-xs font-bold">확인</button>`;
        list.appendChild(div);
      });
    }

    async function resolveReport(id) {
      await supabaseClient.from('error_reports').update({ status: 'resolved' }).eq('id', id);
      loadReports();
    }

    async function fetchGitHubFile(path) {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, { headers: { "Authorization": `token ${token}` } });
      const data = await res.json(); if(data.message) throw new Error(data.message);
      return { sha: data.sha, content: decodeURIComponent(escape(atob(data.content))) };
    }

    async function updateGitHubFile(path, sha, contentStr, msg) {
      const encoded = btoa(unescape(encodeURIComponent(contentStr)));
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
        method: "PUT", headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, content: encoded, sha: sha })
      });
      if(!res.ok) throw new Error("업데이트 실패");
    }
  </script>
</body>
</html>
